  filter:drop-shadow(0 1px 2px rgba(0,0,0,.55))}
.m-struct image{pointer-events:none;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
/* with an icon on top the coloured fill would only show at the rim, which
   reads as a halo — so the structure shape becomes a quiet backing plate */
.m-struct rect,.m-struct path{opacity:.001}
.m-fig[data-skin="schematic"] .m-struct rect,
.m-fig[data-skin="schematic"] .m-struct path{opacity:1}
/* An icon that failed to load removes itself and sets this, so the marker
   underneath comes back to full strength instead of leaving a hole. */
.m-struct[data-noicon] rect,.m-struct[data-noicon] path{opacity:1}
.m-camp[data-noicon] circle,.m-pit[data-noicon] circle{opacity:1}

/* ---------- the game plan on a guide ---------- */
.plan-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 10px}
.plan-fig{max-width:620px}
.plan-note{margin-top:12px}

/* The legend is the only thing that says which coloured line is which, so it
   sits beside the kind chip rather than under the map where it would be
   below the fold on a short screen. */
.m-legend{display:flex;gap:14px;flex-wrap:wrap;list-style:none;margin:0;padding:0;
  font-size:13px;color:var(--muted)}
.m-legend li{display:flex;align-items:center;gap:6px}
.m-legend i{width:14px;height:4px;border-radius:2px;flex:none}

/* The plan layer sits over the markers, in the same square, so a route
   drawn to a camp lands on that camp's icon by construction. */
.m-plan{position:absolute;inset:0;width:100%;height:100%;display:block}

/* A dark under-stroke makes a route readable over both the sand and the
   rock; colour alone washed out over the lighter lanes. */
.pl-line-under{fill:none;stroke:rgba(20,14,8,.55);stroke-width:11;
  stroke-linecap:round;stroke-linejoin:round}
.pl-line{fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.pl-ink{fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:.75}

.pl-pip circle{stroke:rgba(20,14,8,.7);stroke-width:2.5}
.pl-pip text{font:700 17px var(--font-jade,Georgia,serif);fill:#1b1409;
  text-anchor:middle;pointer-events:none;user-select:none}

.pl-danger path{fill:#d8574a;stroke:rgba(20,14,8,.7);stroke-width:2.5}
.pl-danger text{font:700 18px var(--font-jade,Georgia,serif);fill:#fff;
  text-anchor:middle;pointer-events:none}
/* Objective: a blue flag. The pole is stroked and the pennant filled, so it
   keeps its shape against both the sand and the rock. */
.pl-obj .pl-pole{stroke:#14365e;stroke-width:4;stroke-linecap:round;fill:none}
.pl-obj .pl-flag{fill:#3f8fe0;stroke:#14365e;stroke-width:2.5;stroke-linejoin:round}
.pl-note circle{fill:#e0a84a;stroke:rgba(20,14,8,.7);stroke-width:2.5}
.pl-mark{filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}

/* ---------- the game plan editor ----------
   Deliberately few controls. The first version had four tools, five colour
   swatches, five marker kinds, a kind select, a route list and an open rich
   editor — about twenty things to look at before drawing a line. Colours are
   assigned now, the kind select is gone, the route list appears only with a
   second path, and the note hides behind a button. */
.plan-bar{margin:0 0 12px}
  border:1px solid var(--line-soft);border-radius:8px;padding:6px 11px;
  font:inherit;font-size:13.5px;color:var(--text);cursor:pointer}
.plan-tab.on{background:var(--bg-2);border-color:var(--line);color:var(--gold-hi);font-weight:600}
.plan-tab i{font-style:normal;color:var(--muted-2);padding:0 2px;border-radius:4px}
.plan-tab i:hover{background:var(--red);color:#fff}
.plan-tab.add{color:var(--muted)}

/* One column: the map, with its controls above and its labels below. Two
   columns put the map in a 560px box beside a mostly-empty sidebar. */
.plan-edit{max-width:620px}
.plan-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.pt-group{display:flex;gap:4px;align-items:center}
/* display:flex above beats the browser's own [hidden]{display:none}, so the
   marker buttons stayed on screen under every tool however correctly the
   script set .hidden. Any element given display: needs its own hidden rule. */
.pt-group[hidden]{display:none}
.pt-right{margin-left:auto}

/* A tool button says what it does under its name, so the map needs no key. */
.pt{background:var(--panel-2);border:1px solid var(--line-soft);border-radius:8px;
  padding:6px 11px;font:inherit;font-size:13px;color:var(--text);cursor:pointer;
  display:flex;flex-direction:column;align-items:flex-start;line-height:1.25}
.pt b{font-weight:600;font-size:13.5px}
.pt small{color:var(--muted-2);font-size:10.5px}
.pt:hover{background:var(--bg-2)}
.pt.on{background:var(--bg-2);border-color:var(--line);color:var(--gold-hi)}
.pt.on small{color:var(--gold-hi);opacity:.75}
.pt.ghost{flex-direction:row;align-items:center;padding:7px 11px;font-size:12.5px;
  color:var(--muted);background:none}
.pt.ghost:hover{background:var(--panel-2);color:var(--text)}
.pt.ghost.danger:hover{background:var(--red);border-color:var(--red);color:#fff}
.pt.mk{flex-direction:row;align-items:center;gap:5px;padding:6px 9px;font-size:12.5px}
.pt.mk span{font-size:17px;line-height:1}

.plan-say{margin:0 0 7px;font-size:13px;color:var(--muted);min-height:18px}
.plan-canvas{cursor:crosshair;touch-action:none}
/* An OUTLINE, not a border, and the browser self-check is why. The map's
   layers are positioned inset:0, which resolves against the PADDING box, so
   a 1px border pushed the art 1px in and shrank it 2px -- while the snap
   preview, a sibling of .m-fig, stayed in the full-size box. Clicks were
   measured in one space and drawn in the other. An outline is painted
   outside the layout entirely, so every layer shares one coordinate space. */
.plan-canvas .m-fig{outline:1px solid var(--line-soft);outline-offset:-1px}

.plan-after{margin-top:12px;display:flex;flex-direction:column;gap:9px;align-items:flex-start}
.plan-after>*{width:100%}
#planTitle{padding:8px 10px;font:inherit;font-size:14px;color:var(--text);
  background:var(--bg-2);border:1px solid var(--line);border-radius:8px}

.pr-list{display:flex;flex-direction:column;gap:5px}
.pr{display:flex;align-items:center;gap:7px;padding:4px 6px;border-radius:7px;
  border:1px solid transparent;cursor:pointer}
.pr.on{border-color:var(--line);background:var(--panel-2)}

  .line-tools button.card-pick.on.auto{color:var(--gold-hi);opacity:.5;background:none}
  .slot-row.active{border-style:solid}
  .add-line{display:flex;align-items:center;gap:10px;margin-top:2px}
  .add-line .cap-note{color:var(--muted-2);font-size:11.5px}

  /* ---- matchups ---- */
  .mu-add{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .mu-add input{width:230px}
  /* The listbox is absolutely positioned so opening it doesn't shove the
     rows underneath down the page, and z-index clears the sticky bars. */
  .mu-combo{position:relative}
  .mu-opts{position:absolute;z-index:40;top:calc(100% + 4px);left:0;width:268px;
    max-height:272px;overflow:auto;background:#f0e4b1;padding:4px;
    border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:0 6px 18px rgba(60,40,10,.22)}
  .mu-opt{display:flex;align-items:center;gap:9px;width:100%;padding:5px 7px;
    border:0;border-radius:6px;background:none;cursor:pointer;text-align:left}
  /* .on is the keyboard cursor and :hover the mouse one — both highlight,
     so arrowing down and moving the mouse don't fight over which is lit. */
  .mu-opt:hover,.mu-opt.on{background:hsla(43,47%,60%,.55)}
  .mu-opt .portrait{width:28px;height:28px;flex:none;border-radius:5px;
    object-fit:cover;font-size:12px}
  .mu-opt .nm{font-size:13.5px;color:var(--text);overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .mu-opt .cls{margin-left:auto;flex:none;font-size:11px;color:var(--muted-2)}
  .mu-opts .none{padding:9px;font-size:12.5px;color:var(--muted-2)}
  .mu-add .cap-note{color:var(--muted-2);font-size:11.5px}
  .mu-row{display:grid;grid-template-columns:34px 150px auto minmax(0,1fr) 28px;
    gap:9px;align-items:center;padding:7px 9px;margin-bottom:6px;
    border:1px solid var(--line);border-radius:var(--radius);
    background:hsla(43,47%,60%,.2)}
  .mu-row .por{width:34px;height:34px;border-radius:6px;display:block;
    border:1px solid var(--line);object-fit:cover;background:var(--bg-2)}
  .mu-row .nm{font-size:14px;color:var(--text);overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .mu-row input.note{width:100%;font-size:13px;padding:5px 8px}
  /* Three states, one visible choice. Radio-style buttons rather than a
     <select> so the current verdict is readable without opening anything —
     the whole row is otherwise one line of text. */
  .mu-seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;
    overflow:hidden;flex:none}
  .mu-seg button{background:none;border:0;padding:4px 11px;font-size:12px;
    color:var(--muted);cursor:pointer}
  .mu-seg button + button{border-left:1px solid var(--line)}
  .mu-seg button.on.easy{background:rgba(60,110,40,.22);color:#2b4713}
  .mu-seg button.on.even{background:rgba(120,100,40,.2);color:#473a0b}
  .mu-seg button.on.hard{background:rgba(140,52,16,.18);color:#4a1a06}
  .mu-del{background:none;border:0;color:var(--muted-2);font-size:15px;
    line-height:1;padding:4px 6px;border-radius:6px;cursor:pointer}
  .mu-del:hover{background:var(--panel-2);color:var(--red)}
  .mu-empty{color:var(--muted-2);font-size:13px;margin:2px 0 0}
  @media(max-width:760px){
    .mu-row{grid-template-columns:34px minmax(0,1fr) 28px}
    .mu-row .mu-seg,.mu-row input.note{grid-column:2 / 3}
  }

  /* ---------- skill order ----------
     Framed and sheeted like the mastery and rune builders: parchment
     behind, one hairline frame, a header bar, then the table on the
     client's #f0e4b1 with its #cdbd7b row rules. Cells are the same blue
     tab gradient the page selector uses, with the ultimate in the Save
     button's orange so it reads apart from the basics. */
  .skill-build{max-width:1428px;margin:0 auto;padding:16px;border-radius:8px;
    background:url("art/parchment-panel.png") center/114% 114% no-repeat,#d9c9a3}
  /* A container, so the level cells can be sized against the space the row
     actually has rather than against the viewport. */
  .skill-frame{border:1px solid hsla(40,45%,61%,.3);overflow:hidden;background:#f0e4b1;
    container-type:inline-size}
  .skill-header{display:flex;align-items:center;gap:10px;padding:8px 10px;
    background:hsla(40,45%,61%,.2);border-bottom:1px solid hsla(40,45%,61%,.3)}

  /* The grid is a fixed size and centred in the frame rather than stretched
     to it: 18 columns of 34px, one row header, one count column. */
  .skill-tbl{width:max-content;margin:0 auto;border-collapse:collapse;
    font-family:var(--font-jade);table-layout:fixed}
  .skill-tbl th{font-weight:400;padding:0;text-align:center;color:#7d5444}
  .skill-tbl tr:first-child th{font-size:11px;padding:6px 0}
  /* The column, not just the button inside it. table-layout:fixed takes its
     widths from the first row, so the header cells have to be sized too —
     styling .sk alone left the column at a hard 38px and the row never got
     any narrower, which is why the detail panel kept wrapping. */
  .skill-tbl td,.skill-tbl th.lvl{width:calc(var(--cell) + 4px)}
  .skill-tbl td{padding:2px;text-align:center}
  .skill-tbl th.used,.sk-used{width:44px}
  .skill-tbl tr + tr{border-top:1px solid #cdbd7b}
  .skill-tbl th.k{text-align:left;width:190px;padding:6px 10px 6px 4px}
  .lvl-label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#7d5444}
  /* the level you're on */
  .skill-tbl th.now{color:#000;font-weight:700;position:relative}
  .skill-tbl th.now::after{content:"";position:absolute;left:50%;bottom:0;translate:-50% 0;
    width:16px;height:2px;background:#c89b3c;border-radius:1px}

  /* row header: icon, hotkey, name */
  .skill-tbl th.k{display:flex;align-items:center;gap:9px;height:48px}
  .sk-key{width:20px;height:20px;flex:none;border-radius:2px;display:grid;place-items:center;
    background:var(--c);border:1px solid rgba(240,230,210,.25);
    color:var(--ink,#010a13);font-family:var(--font-jade);font-size:11px;font-weight:700}
  .sk-name{flex:1;font-size:14px;color:#000;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;min-width:0}
  .sk-used{padding:0 10px;font-size:12px;color:#7d5444;font-variant-numeric:tabular-nums}
  .sk-used.full{color:#000}

  /* every cell the same square, whatever is in it */
  /* Everything on the row except the cells is fixed: 190 header + 44 count
     + 20 body padding + 14 gap + 260 panel, and each column carries 4px of
     cell padding, so the fixed part is 600px. Whatever is left over
     divides between the 18 cells, capped at their natural 34px and floored
     at 24px so they stay clickable. That keeps the detail panel on the
     right — at full-size cells down to about a 1700px window, and shrinking
     from there to roughly 1500px. Below that .skill-body still wraps. */
  .skill-body{--cell:28px}
  @supports (width:1cqw){
    .skill-body{--cell:clamp(24px,calc((100cqw - 612px) / 18),34px)}
  }
  .sk{position:relative;display:block;width:var(--cell);height:var(--cell);padding:0;overflow:hidden;
    border-radius:2px;font-family:inherit;font-size:13px;transition:.13s;
    background:#e8dec1;border:1px solid rgba(201,162,60,.5);color:transparent}
  .sk:hover:not(:disabled){border-color:#c9a23c}
  .sk:disabled{background:rgba(0,0,0,.06);border-color:rgba(201,162,60,.25);cursor:not-allowed}
  .sk img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  /* rank chip, bottom-right, the same idiom as the mastery badge */
  .sk i{position:absolute;right:0;bottom:0;z-index:2;font-style:normal;
    min-width:13px;padding:0 2px;line-height:13px;font-size:10px;font-weight:700;
    color:#fff;background:rgba(4,7,11,.82);border-top-left-radius:3px}
  /* placed but without art — the colour and a centred rank stand in */
  .sk.on{border-color:hsla(0,0%,100%,.25);
    background:linear-gradient(180deg,#4276bc,#1e3656)}
  .sk.on:not(.art){background:linear-gradient(180deg,#1e2328,#010a13);border-color:#987b2d}
  .sk.on:not(.art) i{inset:0;display:grid;place-items:center;min-width:0;padding:0;
    font-family:var(--font-jade);font-size:15px;color:#c8aa6e;background:none;border-radius:0}
  .skill-tbl tr:last-child .sk.on:not(.art){background:linear-gradient(180deg,#1e2328,#010a13)}
  .skill-tbl tr:last-child .sk.on{background:linear-gradient(0deg,#c73e00 37.5%,#efa23a)}
  .sk.on:hover{filter:brightness(1.12)}
  .skill-tbl:hover .sk-row:not(:hover) .sk.on{opacity:.75}

  /* ---------- ability detail panel ----------
     Sits beside the grid rather than over it, styled like the rune
     STATISTICS box: parchment, gold hairline, black text. */
  /* The frame clips (overflow:hidden), so anything that doesn't fit on this
     row is cut off rather than pushed out — which is what happened to the
     detail panel once the builders band narrowed to the form column. Wrapping
     drops the panel under the grid instead. It needs the grid's own 18x34px
     width plus the row header and count column, and there is no width at
     which shrinking the panel would help, so wrap is the only honest fix. */
  .skill-body{display:flex;align-items:flex-start;justify-content:center;
    gap:14px;padding:10px;flex-wrap:wrap}
  .skill-detail{flex:none;width:260px;min-height:180px;padding:10px 12px;
    border:1px solid hsla(40,45%,61%,.3);background:rgba(0,0,0,.06);
    font-family:var(--font-jade)}
  .sd-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .sd-head img{width:34px;height:34px;border-radius:2px;flex:none;
    border:1px solid rgba(201,162,60,.5)}
  .sd-key{width:20px;height:20px;flex:none;border-radius:2px;display:grid;place-items:center;
    background:var(--c);border:1px solid rgba(240,230,210,.25);color:var(--ink,#010a13);
    font-size:11px;font-weight:700}
  .sd-head b{font-size:15px;font-weight:400;color:#000;min-width:0}
  .sd-head em{font-style:normal;font-size:12px;color:#7d5444}
  .sd-desc{margin:0;font-size:13px;line-height:1.45;color:#000}
  .sd-hint{margin:0;font-size:12.5px;line-height:1.5;color:#7d5444}
  .sd-nums{list-style:none;margin:10px 0 0;padding:8px 0 0;border-top:1px solid #cdbd7b}
  .sd-nums li{display:flex;justify-content:space-between;gap:10px;padding:2px 0;font-size:12.5px}
  .sd-nums li span{color:#7d5444}
  .sd-nums li b{color:#000;font-weight:400;font-variant-numeric:tabular-nums}
  .sd-src{margin:8px 0 0;font-size:11px;color:#7d5444}

  /* ---------- ability art ----------
     The champion's own icon with the hotkey in the corner, the way the
     in-game HUD shows it. `.noart` is switched on when the image 404s, at
     which point the coloured letter tile underneath shows through — so a
     missing file degrades to exactly the old look rather than a gap. */
  .ab-ico{position:relative;display:inline-grid;place-items:center;flex:none;
    width:var(--sz,34px);height:var(--sz,34px);border-radius:6px;overflow:hidden;
    background:var(--c,#2a3442);border:1px solid var(--line)}
  .ab-ico img{width:100%;height:100%;object-fit:cover;display:block}
  .ab-ico i{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;
    font-weight:800;font-size:calc(var(--sz,34px) * .42);color:#0b0f15;opacity:0}
  .ab-ico.noart img{display:none}
  .ab-ico.noart i{opacity:1}
  /* No art yet — an empty jade plate rather than a flat colour block:
     the client's dark fill, a #987b2d edge and the hotkey in its gold. */
  .ab-ico.noart{background:linear-gradient(180deg,#1e2328,#010a13);
    border-color:#987b2d;box-shadow:inset 0 0 0 1px rgba(240,230,210,.06)}
  .ab-ico.noart i{color:#c8aa6e;font-family:var(--font-jade);font-weight:400}
  .ab-ico b{position:absolute;right:0;bottom:0;z-index:2;font-size:9px;font-weight:800;
    line-height:11px;padding:0 3px;color:#f0f3f7;background:rgba(4,7,11,.82);
    border-top-left-radius:4px;letter-spacing:-.02em}
  .ab-ico.sm{--sz:26px}
  .ab-ico.sm b{font-size:8px;line-height:10px}
  .ab-ico.on{box-shadow:0 0 0 1px var(--c),0 0 7px rgba(0,0,0,.5)}
  .ab-ico.dim{opacity:.45}
  button.ab-ico{padding:0;cursor:help}

  .sk-passive{display:flex;align-items:center;gap:8px;margin-left:auto;
    font-family:var(--font-jade);font-size:13px;color:#7d5444}
  .sk-passive b{color:#000;font-weight:400}
  .sk-passive .lbl{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:#7d5444}

  /* max-priority summary */
  /* Lives in .skill-header now, so no top margin and it takes the width it
     needs; .sk-passive keeps its place at the right of the bar. */
  .sk-max{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:0;min-width:0;
    min-height:36px;font-family:var(--font-jade)}
  .sk-max .lbl{font-family:var(--font-jade);font-size:13px;text-transform:uppercase;
    letter-spacing:.07em;color:#7d5444;flex:none}
  .sk-max .chain{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  /* 34px, matching a level cell at full size, against the 26px the old row
     used — the point of moving it up here was to make it readable. */
  .sk-max .ab-ico{--sz:34px}
  .sk-max .sep{color:#7d5444;font-size:15px}
  .sk-max .none{color:#7d5444;font-size:12.5px}

  .sk-auto{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;
    padding-top:12px;border-top:1px solid var(--line)}
  /* Reset is the odd one out — it undoes rather than fills — so it sits at
     the far end of the row rather than next to Fill. */
  .sk-auto #skReset{margin-left:auto}
  .sk-auto span{font-size:12.5px;color:var(--muted)}
  .sk-auto select{width:auto;padding:6px 9px;font-size:12.5px}
  .chk{display:flex;align-items:center;gap:6px;cursor:pointer}
  .chk input{accent-color:var(--gold);width:14px;height:14px;cursor:pointer}

  /* real art inside the editor's chips */
  .item-img{width:100%;height:100%;border-radius:6px;object-fit:cover;display:block}
  .item.placed,.item.pickable{overflow:visible;background:var(--bg-2)}
  .item.pickable{padding:0;border:1px solid var(--line)}
  .item .missing{width:100%;height:100%;border-radius:6px;background:#2a3444;display:block}
  .champ-opt .portrait{object-fit:cover}
  .champ-picked .portrait{object-fit:cover}
  #poolSearch{margin-left:auto;flex:none;width:150px;padding:4px 9px;font-size:12.5px;
    background:var(--bg-2);border:1px solid var(--line);color:var(--text);
    border-radius:7px;outline:none;font-family:inherit}
  #poolSearch:focus{border-color:var(--gold)}
  .pool-tabs{align-items:center}

  /* ---- the two picks, in their own row ----
     A pair of fixed slots above the picker. They keep their size whether
     filled or not, so the row doesn't reflow as you choose and the empty
     one reads as a place to put something. Sized off the picker's 48px
     tile so the two rows relate; the gold ring marks them as chosen the
     same way .spell-pick.on does. */
  /* A set is a row: its label, its two slots, and (when there are two) the
     control to drop it. The selected row is the one the picker fills, so it
     takes the gold edge the active build line uses. */
  .spell-set{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    padding:8px 10px;margin-bottom:8px;border-radius:8px;
    border:1px solid transparent;transition:.14s}
  .spell-set.on{border-color:var(--line);background:hsla(43,47%,60%,.22)}
  /* With one set there is nothing to choose between, so no pointer. */
  .spell-set:not(.on){cursor:pointer}
  .spell-set:not(.on):hover{border-color:var(--line-soft)}
  .set-tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
    color:var(--muted-2);flex:none;width:74px}
  .spell-set.on .set-tag{color:var(--gold-hi)}
  .spell-set [data-dropset]{margin-left:auto}
  .spell-set-add{margin-top:12px}
  .spell-set-add:empty{display:none}

  /* The banner that says you are changing something people can already
     read. Deliberately loud: publishing over a live guide is not the same
     act as saving a draft. */
  /* 60px is the header's height, and z-index 59 keeps it under the header
     rather than over it — the bar follows the header, it doesn't replace
     it. */
  .edit-bar{position:sticky;top:60px;z-index:59;display:flex;align-items:center;gap:12px;
    flex-wrap:wrap;padding:9px 20px;background:#1e3656;color:#f0e6d2;
    border-bottom:1px solid var(--line);font-size:13.5px}
  .edit-bar b{font-family:var(--font-head);font-weight:400;font-size:15px}
  .edit-bar span{color:#c8b7a0}
  .edit-bar .btn{margin-left:auto}
  .edit-bar .btn + .btn{margin-left:0}
  .edit-bar.missing{display:block;background:#5c3a1e}

  /* "Copy from" — a select that behaves as an action: it resets to the
     placeholder as soon as it has done its job. */
  .rune-foot .foot-tip{font-size:12px;color:var(--muted-2);margin-left:auto}
  .setup-tools:empty{display:none}
  .spell-slots{display:flex;gap:10px}
  .spell-slot{display:flex;align-items:center;gap:9px;min-width:0;flex:0 1 210px;
    padding:6px 10px 6px 6px;border-radius:8px;border:1px solid var(--line);
    background:var(--bg-2);font-family:inherit;text-align:left;transition:.14s}
  .spell-slot span{font-size:12.5px;min-width:0;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .spell-slot .slot-img{width:48px;height:48px;flex:none;border-radius:6px;
    border:1px solid var(--line);object-fit:cover;display:block}
  .spell-slot.filled{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
  .spell-slot.filled span{color:var(--gold-hi);font-weight:600}
  .spell-slot.filled:hover{background:var(--panel-2)}
  /* An empty slot is a dashed outline with a blank tile — no border ring,
     nothing to click. */
  .spell-slot.empty{border-style:dashed;background:none}
  .spell-slot.empty i{width:48px;height:48px;flex:none;border-radius:6px;
    border:1px dashed var(--line);background:hsla(43,47%,60%,.18)}
  .spell-slot.empty span{color:var(--muted-2)}

  /* summoner spell picker */
  .spell-pick{display:flex;flex-direction:column;align-items:center;gap:5px;width:66px;
    background:none;border:0;padding:0;transition:.14s}
  .spell-pick:hover{transform:translateY(-2px)}
  .spell-pick .sp-img{width:48px;height:48px;border-radius:8px;border:1px solid var(--line);
    background:var(--bg-2);object-fit:cover;display:block}
  .spell-pick:hover .sp-img{border-color:#35455a}
  .spell-pick.on .sp-img{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
  .spell-pick span{font-size:10.5px;color:var(--muted-2);text-align:center;line-height:1.2;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .spell-pick.on span{color:var(--gold-hi);font-weight:600}
  .spell-pick.dim{opacity:.38}
  #spellPills{gap:9px}

  /* rune page summary */
  .rune-sum{grid-column:1/-1;display:flex;flex-direction:column;gap:4px;
    background:var(--bg-2);border:1px solid var(--line);border-radius:9px;padding:11px 13px}
  .rune-sum b{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted-2)}
  .rune-sum span{font-size:12.5px;color:var(--text)}
  .rune-sum .lvl{color:var(--muted)}
  .rune-sum .cost{color:var(--gold-hi);font-weight:600;font-size:12px}
  .rune-sum.empty{color:var(--muted-2);font-size:12.5px;margin:0}
  .rune-row .rune-img,.rune-row .rune-badge{margin-left:auto}
  /* ---------- masteries ----------
     The panels, rows and mastery buttons are styled in site.css. Nothing
     here may use .mast or .mast-foot — those are the shared button and
     per-tree footer, and a local rule would override them. */
  /* The mastery footer reuses .rune-foot from site.css so the two builders
     keep the same controls in the same place. */

  /* ---------- runes ---------- */
  .runes{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .rune-row{display:flex;align-items:center;gap:9px;background:var(--bg-2);
    border:1px solid var(--line);border-radius:9px;padding:8px 10px}
  .rune-row .qty{width:30px;height:30px;border-radius:7px;flex:none;display:grid;
    place-items:center;font-size:12px;font-weight:800;color:#0b0f15}
  .rune-row select{padding:5px 7px;font-size:12.5px;border:0;background:transparent}
  .rune-row select:focus{box-shadow:none}
  .rune-row div{min-width:0;flex:1}
  .rune-row span{display:block;font-size:10.5px;color:var(--muted-2);text-transform:uppercase;
    letter-spacing:.06em;font-weight:700}

  /* ---------- sections ---------- */
  .sec{border:1px solid var(--line);border-radius:var(--radius);background:#f0e4b1;
    margin-bottom:10px}
  .sec-hd{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line)}
  .sec-hd input{background:transparent;border:0;padding:4px 6px;font-weight:700;font-size:14px}
  .sec-hd input:focus{box-shadow:none;background:#fff;border-radius:var(--radius)}
  /* .sec is the card; the editor inside it needs its own margins now that
     it draws a box of its own. */
  .sec .rt-wrap{padding:10px}
  .grip{color:var(--muted-2);font-size:13px;cursor:grab;padding:0 2px;user-select:none}
  .sec-tools{display:flex;gap:3px;flex:none}
  .sec-tools button{width:26px;height:26px;border-radius:6px;border:1px solid transparent;
    background:none;color:var(--muted-2);font-size:12px;padding:0;font-weight:700}
  .sec-tools button:hover{background:hsla(43,47%,60%,.5);color:var(--text)}
  .sec-tools button.del:hover{color:var(--red)}
  /* A note sits under the builder it explains, set apart by a rule rather
     than a box — the sections lost their boxes, and this should not
     reintroduce one. */
  /* Groups a toolbar with the editor it drives, which is how a button
     finds its own editor without carrying an index. */
  .rt-wrap{min-width:0}
  .note-block{margin-top:18px;padding-top:14px;border-top:1px solid var(--line-soft)}
  .note-hd{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .note-label{margin:0;font-family:var(--font-head);font-size:15px;
    font-weight:400;color:var(--muted)}
  .note-hd [data-delnote]{margin-left:auto}
  /* The offer, before there is anything to show. */
  .note-add{margin-top:16px}
  .note-block .rt{min-height:100px}
  /* A build line's own note, indented under its items. */
  .line-note{margin:10px 0 0 2px}
  .line-note .rt{min-height:90px}
  .line-note .note-label{font-size:14px}

  /* Formatting bar: a strip of square buttons between the heading row and
     the text, bounded by the same hairlines as the rest of the section so
     it reads as part of the editor rather than as a floating widget. */
  .md-bar{display:flex;gap:2px;flex-wrap:wrap;align-items:center;
    padding:0 0 5px}
  .md-bar button{width:28px;height:26px;padding:0;border-radius:5px;
    border:1px solid transparent;background:none;color:var(--muted);
    font-family:var(--font);font-size:13px;line-height:1;
    display:grid;place-items:center;transition:.13s}
  .md-bar button:hover{background:var(--panel-2);color:var(--text);border-color:var(--line)}
  .md-bar button:active{background:hsla(43,47%,60%,.45)}
  /* Lit while the caret sits in text carrying that format. */
  .md-bar button.on{background:rgba(200,163,85,.18);border-color:var(--line);color:var(--gold-hi)}
  .md-bar button b{font-weight:800}
  .md-bar button u{text-underline-offset:2px}

  /* The body is a contenteditable, styled to read like the page it will
     become rather than like a form field: no border, the guide's own type,
     and formatting shown as formatting. */
  /* Bordered like every other field on the page — white fill, gold rule,
     the same focus ring as the text inputs — so it reads as somewhere to
     type rather than as a paragraph that happens to accept a caret. */
  /* 15px/1.7 rather than 13.5/1.6. This is the one place on the page where
     someone writes several paragraphs, and it was set smaller than the
     guide that gets published from it. */
  .rt{min-height:150px;padding:12px 14px;font-size:15px;line-height:1.7;
    color:var(--text);background:#fff;border:1px solid var(--line);
    border-radius:var(--radius);outline:none;overflow-wrap:anywhere;transition:.15s}
  .rt:focus{border-color:#c8aa6e;box-shadow:0 0 0 2px hsla(43,47%,60%,.45)}
  /* :empty only holds while there is genuinely nothing in the box, which
     is what a placeholder should track. */
  .rt:empty::before{content:attr(data-ph);color:var(--muted-2)}
  .rt p{margin:0 0 8px}
  .rt p:last-child{margin-bottom:0}
  .rt b,.rt strong{font-weight:700;color:var(--text)}
  .rt u{text-underline-offset:2px}
  .rt ul,.rt ol{margin:6px 0;padding-left:22px}
  .rt li{margin:2px 0}
  .rt blockquote{margin:8px 0;padding:2px 0 2px 12px;
    border-left:2px solid var(--line);color:var(--muted)}
  .rt a{color:var(--gold-hi);text-decoration:underline}
  /* ---- reference chips ----
     Inline, icon then name, in the client's blue. contenteditable="false"
     on the span makes the browser treat one as a single character: the
     caret steps over it and Backspace removes the whole thing. */
  /* display:inline, not inline-flex. An inline-flex box takes its baseline
     from its first item; that item is an image, which has no baseline, so
     the browser falls back to the box's bottom edge and the whole chip
     rides above the line. Plain inline text sits on the baseline the way
     the words either side of it do.

     The icon is then nudged below the baseline by a quarter of an em so its
     centre lands on the x-height rather than resting on the baseline. In em
     so it holds wherever the chip is used, not just at 13.5px. */
  .ref{display:inline;padding:0 3px;border-radius:3px;color:#2c66aa;
    font-weight:600;white-space:nowrap;background:rgba(44,102,170,.09)}
  /* A reference whose catalogue hasn't loaded yet: still a reference, just
     without its art. It fills in on its own. */
  .ref.pending{background:rgba(44,102,170,.05);color:#4a7cbb}
  .ref-ico{width:16px;height:16px;border-radius:2px;
    display:inline-block;vertical-align:-0.25em;margin-right:4px}

  /* the @ menu */
  /* No scrollbar: the list is capped at REF_MAX, so eight 32px rows plus
     4px of padding either side is the whole of it — 264px, which is what
     the max-height used to be. A bar here invited scrolling the menu, and
     that scroll would fall through to the page and dismiss it. */
  .ref-menu{position:fixed;z-index:95;min-width:250px;max-width:330px;
    overflow:hidden;padding:4px;background:#fff;border:1px solid var(--line);
    border-radius:var(--radius);box-shadow:0 14px 34px rgba(45,32,16,.28)}
  .ref-menu[hidden]{display:none}
  .ref-opt{display:flex;align-items:center;gap:8px;width:100%;padding:5px 7px;
    border:0;border-radius:5px;background:none;text-align:left;font-family:inherit;
    font-size:13px;color:var(--text)}
  .ref-opt .ref-ico{width:22px;height:22px;border-radius:3px;margin-right:0}
  .ref-opt .ref-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ref-opt .ref-kind{flex:none;font-size:11px;color:var(--muted-2)}
  .ref-opt.on,.ref-opt:hover{background:rgba(44,102,170,.12);color:#2c66aa}
  /* Sits under the box, flush with its edge — the 12px inset was aligning
     it to the old borderless editor's text. */
  .md-note{color:var(--muted);font-size:12px;padding:0;margin:6px 0 0}

  /* ---------- preview rail ---------- */
  /* z-index keeps the card above anything it scrolls past — the rune
     sockets are positioned children and would otherwise paint over it. */
  .rail{position:sticky;top:76px;z-index:40}
  .rail h3{margin:0 0 3px;font-family:var(--font-head);font-size:13px;
    text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .rail .rail-hint{margin:0 0 11px;font-size:12px;color:var(--muted-2)}
  .card{background:#f0e4b1;border:1px solid var(--line);border-radius:var(--radius);
    padding:14px;display:flex;gap:12px}
  .card-main{min-width:0;flex:1}
  .card h4{margin:0 0 3px;font-family:var(--font-head);font-size:16px;font-weight:400;
    line-height:1.3;color:var(--text);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  /* .tag now lives in site.css — it is drawn here, on the home list and on
     a published guide, and the published one had no styling at all. */
  .byline{color:var(--muted);font-size:12.5px;margin:0 0 9px}
  .byline b{color:#a9bbd0;font-weight:600}
  .blurb{color:var(--muted-2);font-size:12.5px;margin:0 0 9px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  /* Summoners and the build line share one wrapping row. The gold hairline
     between them only appears when both groups have something in them, so a
     card with no spells picked doesn't show a rule floating on its own. */
  /* Two stacked rows: summoners on top, the build line under them. Both
     rows start at the same left edge and use the same chip size and gap,
     so the icons line up in columns down the card. The card-main column is
     about 204px, which takes five 30px chips — a six-item line wraps onto
     a second row of its own without disturbing the spells above it. */
  .card-kit{display:flex;flex-direction:column;gap:6px}
  .kit-row{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .kit-note{margin:7px 0 0;font-size:11px;color:var(--muted-2)}
  .kit-note:empty{display:none}
  .kit-note b{color:var(--muted);font-weight:600}
  /* Square, like the items beside them — the hairline is what separates the
     two groups, so the shape doesn't need to do that job as well. */

  .vote{display:flex;flex-direction:column;align-items:center;gap:1px;flex:none;align-self:flex-start;
    border:1px solid var(--line);background:var(--bg-2);border-radius:7px;padding:5px 9px;
    color:var(--muted);font-size:12.5px;font-weight:700}
  .vote .ar{font-size:9px;line-height:1}

  .checks{margin:14px 0 0;padding:12px;background:var(--panel);border:1px solid var(--line-soft);
    border-radius:var(--radius);list-style:none}
  .checks li{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted-2);padding:3px 0}
  .checks li b{width:15px;height:15px;border-radius:99px;border:1px solid var(--line);
    flex:none;display:grid;place-items:center;font-size:9px;color:transparent}
  .checks li.ok{color:var(--text)}
  .checks li.ok b{background:#2f7d32;border-color:#2f7d32;color:#f0e6d2}

  .publish{display:flex;gap:8px;margin-top:14px}
  .publish .btn{flex:1;padding:10px;font-size:14px}
  .saved{text-align:center;font-size:11.5px;color:var(--muted-2);margin-top:9px;min-height:16px}
  .saved.flash{color:var(--teal)}

  /* ---------- modal ---------- */
  .scrim{position:fixed;inset:0;background:rgba(4,7,11,.75);backdrop-filter:blur(3px);
    z-index:90;display:none;place-items:center;padding:20px}
  .scrim.open{display:grid}
  .modal{background:#f0e4b1;border:1px solid #c9a23c;border-radius:var(--radius);
    padding:24px;max-width:400px;width:100%;text-align:center;
    box-shadow:0 24px 70px -20px rgba(0,0,0,.6)}
  .modal .tick{width:46px;height:46px;border-radius:99px;background:hsla(43,47%,60%,.5);
    border:1px solid #c9a23c;color:var(--title);display:grid;place-items:center;
    font-size:22px;margin:0 auto 12px}
  .modal h3{margin:0 0 6px;font-size:19px;color:var(--title)}
  .modal p{margin:0 0 18px;color:var(--muted);font-size:13.5px}
  .modal code{background:#fff;border:1px solid var(--line);border-radius:var(--radius);
    padding:1px 5px;font-size:12px;color:var(--muted)}

  /* the toast reads over anything, so it takes the client's black panel */
  .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,80px);
    display:flex;align-items:center;gap:14px;
    background:rgba(0,0,0,.95);border:1px solid #c9a23c;border-radius:4px;
    color:#f0e6d2;font-family:var(--font-head);padding:10px 16px;font-size:13.5px;
    z-index:95;opacity:0;transition:.25s;box-shadow:2px 2px 6px rgba(0,0,0,.6);
    pointer-events:none}
  /* An undo toast lingers and takes clicks; a plain one does neither. */
  .toast-undo{background:none;border:1px solid #c9a23c;border-radius:3px;
    color:#f0e6d2;font-family:inherit;font-size:12.5px;padding:3px 10px;transition:.15s}
  .toast-undo:hover{background:rgba(201,162,60,.25)}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media(max-width:1000px){
    /* One column: clear the explicit placement or the rail would be sent to
       a column that no longer exists. */
    .layout{grid-template-columns:1fr}
    #form,.builders,.rail{grid-column:1;grid-row:auto}
    .rail{position:static}
    .runes{grid-template-columns:1fr}
  }
  @media(max-width:640px){
    .hdr{gap:14px}
    nav.main{display:none}
    .skill-tbl{font-size:9px}
  }

      symmetrised about that value they agreed with it to 0.00px BY
      CONSTRUCTION, so they could no longer test it. The evidence was
      circular and a real error hid under it.

   2. Fitted to the structure glyphs on the annotated plate. Residuals came
      out at 1.75px, which read as decisive and was not: the glyphs are a UI
      overlay, and fitting a centre to them absorbs whatever offset they
      carry. It landed 22px from the truth while looking ten times better
      than the previous attempt. A tight fit to the wrong features beats a
      loose fit to the right ones on every metric except correctness.

   What it rests on now: all 15 structures on BOTH sides were clicked on
   the platform squares in the terrain. That gives 15 genuine pairs, and
   their implied centres agree to a median absolute deviation of (1.2,
   2.4)px with a worst case of 14.9px. It is a median of fifteen direct
   measurements of the same quantity.

   measured rather than one being mirrored. It still sets the symmetry for
   the terrain and the camps. */

/* ---- turrets, inhibitors and nexuses ----

   ALL THIRTY MEASURED. Both sides were clicked by hand on the platform
   squares drawn into the terrain -- the buildings themselves. Nothing here
   is mirrored, so no centre has to be right for these to be right.

   THE ROTATION SWAPS TOP AND BOTTOM. This is what the red side had wrong.
   Rotating the map 180 degrees carries the top lane onto the BOTTOM lane --
   the path that runs up the left edge and across the top becomes the one
   down the right edge and across the bottom. So the partner of blue-top-t1
   is red-BOT-t1. The red keys used to be generated by replacing "blue-"
   with "red-" and keeping the lane, which put every top and bottom structure
   on the wrong side of the map: pairing them that way leaves a median
   absolute deviation of (60.0, 65.4)px, while pairing with the swap leaves
   (1.2, 2.4)px. Mid structures and the nexus map to themselves, which is
   why only those four of fifteen looked right and the error passed as
   "slightly off" rather than as a wrong lane.

   MAP_LANES had this right all along -- bot is generated as the rotation of
   top. Only the structure keys did not.

   Tiers run outward from your own nexus: t1 is the outer turret, t3 guards
   the inhibitor. */

/* Every place a plan can refer to by name, in one list — camps and pits
   together, because an author placing a route step does not care which
   kind of thing they are clicking. */
function mapPlaces(){
  const tidy = k => k.replace(/-/g, " ").replace(/\bt(\d)\b/, "T$1")
    .replace(/\binhib\b/, "inhibitor").replace(/^./, c => c.toUpperCase());
  return MAP_CAMPS.map(c => ({key: c.key, x: c.x, y: c.y, name: c.name, short: c.short}))
    .concat(MAP_PITS.map(p => ({key: p.key, x: p.x, y: p.y, name: p.name, short: p.name})))
    .concat(MAP_STRUCTURES.map(t => ({key: t.key, x: t.x, y: t.y, name: tidy(t.key), short: ""})));
}

/* The nearest named place to a point, or null when nothing is close enough.
   Used by the editor so a route step lands ON the red buff rather than
   somewhere near it, and so the stored plan can say so. */
function mapNearest(x, y, within){
  const limit = within == null ? 44 : within;
  let best = null, bestD = Infinity;
  for(const p of mapPlaces()){
    const d = Math.hypot(p.x - x, p.y - y);
    if(d < bestD){ bestD = d; best = p; }
  }
  return (best && bestD <= limit) ? best : null;
}

/* ---- the drawing ----
   Terrain ONLY — ground, bases, lanes, river, walls. Camps and pits belong
   to mapOverlaySvg, which sits above whichever backdrop is in use. They
   used to be drawn here too, which put two of every camp on the schematic:
   one from the terrain, one from the overlay.

   One <svg> of terrain and nothing interactive. Plans are drawn into a
   separate layer on top by whoever renders them, so this never has to know
   what a route is.

   Every corridor is painted TWICE: a wider darker pass for the edge, then
   the fill on top. That is what gives rock and road a rim instead of a flat
   silhouette, and it costs one extra path per shape.

   Each pass is a GROUP at partial opacity rather than paths at partial
   opacity. Forty-two overlapping half-transparent rocks darken wherever two
   meet, and the seams are the first thing the eye finds.

   NO TURRETS. There is no measured position for one, and putting remembered
   coordinates back on the page is the exact mistake the painting pass was
   done to undo. They are a short click pass away when they are wanted. */

/* Gradients need ids, and a page showing two maps would otherwise have two
   elements answering to the same one — the second map would silently borrow
   the first one's fills. */
let MAP_UID = 0;

function mapTerrainSvg(){
  const u = "m" + (++MAP_UID);
  /* grow is how much wider the edge pass runs than the fill */
  const band = (cls, list, grow) => list.map(s =>
    `<path class="${cls}" d="${s.d}" stroke-width="${s.w + grow}"/>`).join("");

  return `<svg class="m-svg" viewBox="0 0 ${MAP_SIZE} ${MAP_SIZE}"
     xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Season 3 Summoner's Rift, blue base bottom left">
    <defs>
      <clipPath id="${u}-clip"><rect x="0" y="0" width="${MAP_SIZE}" height="${MAP_SIZE}" rx="16"/></clipPath>
      <radialGradient id="${u}-ground" cx="50%" cy="50%" r="72%">
        <stop offset="0%" stop-color="#d4bd92"/>
        <stop offset="100%" stop-color="#bda47a"/>
      </radialGradient>
      <linearGradient id="${u}-water" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#8fc4de"/>
        <stop offset="100%" stop-color="#6aa5cc"/>
      </linearGradient>
      <radialGradient id="${u}-blue" cx="18%" cy="88%" r="92%">
        <stop offset="0%" stop-color="#4b86c9"/><stop offset="100%" stop-color="#2f5f96"/>
      </radialGradient>
      <radialGradient id="${u}-red" cx="86%" cy="12%" r="92%">
        <stop offset="0%" stop-color="#cf6450"/><stop offset="100%" stop-color="#9e4334"/>
      </radialGradient>
      <radialGradient id="${u}-vig" cx="50%" cy="50%" r="50%">
        <stop offset="62%" stop-color="#000" stop-opacity="0"/>
        <stop offset="100%" stop-color="#4a3a20" stop-opacity=".28"/>
      </radialGradient>
    </defs>

    <g clip-path="url(#${u}-clip)">
      <rect x="0" y="0" width="${MAP_SIZE}" height="${MAP_SIZE}" fill="url(#${u}-ground)"/>

      <g class="m-bases">${MAP_BASES.map(b =>
        `<path class="m-base" d="${b.d}" fill="url(#${u}-${b.key})"/>`).join("")}</g>

      <g class="m-lane-edge">${band("m-band", MAP_LANES, 11)}</g>
      <g class="m-lane">${band("m-band", MAP_LANES, 0)}</g>

      <g class="m-river-edge">${band("m-band", MAP_RIVER, 10)}</g>
      <g class="m-river">${MAP_RIVER.map(s =>
        `<path class="m-band" d="${s.d}" stroke-width="${s.w}" stroke="url(#${u}-water)"/>`).join("")}</g>

      <g class="m-wall-edge">${band("m-band", MAP_WALLS, 7)}</g>
      <g class="m-wall">${band("m-band", MAP_WALLS, 0)}</g>

      <rect x="0" y="0" width="${MAP_SIZE}" height="${MAP_SIZE}" fill="url(#${u}-vig)" pointer-events="none"/>
    </g>
    <rect class="m-frame" x="2" y="2" width="${MAP_SIZE - 4}" height="${MAP_SIZE - 4}" rx="16"/>
  </svg>`;
}


/* ---- the game's own icons ----

   Hotlinked from Community Dragon, like every other Riot image on this site
   except the map plate. Two different sets, because they do two jobs:

   STRUCTURES use the mode's OWN minimap icons, from ux/minimap/icons/jade.
   These are literally the glyphs Riot's annotated plate was drawing, so the
   map ends up showing the same art the game does. "order" is blue, "chaos"
   is red -- the internal team names, which is why they read backwards.

   CAMPS use each monster's circular portrait. The jade minimap set only has
   generic junglecampbasic/mini icons, which would make every camp look the
   same; the portraits tell wolves from wraiths at a glance, which is the
   whole point of a jungle route being legible.

   The Season 3 monsters survive under an s3_ prefix, so these are the
   actual Ancient Golem and Lizard Elder rather than the modern Blue
   Sentinel and Red Brambleback redesigns. Wolves, golems and the great
   wraith kept their original names and need no prefix.

   EVERY ICON FAILS SOFT. The shape and letter are drawn first and the image
   goes over the top, so a path that rots later leaves the old marker behind
   rather than a hole. Nothing here is load-bearing. */
const MAP_ICON_GAME = "https://raw.communitydragon.org/latest/game/assets";
const MAP_ICON_MINIMAP = MAP_ICON_GAME + "/ux/minimap/icons/jade";

/* structure icons, by kind and side */
const MAP_STRUCT_ICON = {
  turret:     {blue: "towerorder.png",     red: "towerchaos.png"},
  inhibitor:  {blue: "inhibitororder.png", red: "inhibitorchaos.png"},
  nexus:      {blue: "nexusorder.png",     red: "nexuschaos.png"}
};
function mapStructIcon(t){
  const f = (MAP_STRUCT_ICON[t.kind] || {})[t.side];
  return f ? `${MAP_ICON_MINIMAP}/${f}` : "";
}

/* Camps use the mode's OWN minimap icons rather than monster portraits.

   The portraits told one camp from another at a glance, which was useful,
   but they are character art and never looked like part of a minimap. These
   four are what Classic actually draws, so the map matches the game.

   The cost is that they are generic: every ordinary camp gets the same
   glyph. That is how the game behaves -- a jungler reads camps by position,
   not by picture -- but this map exists to let a guide NAME places, so the
   short label is drawn over the icon instead of only standing in when an
   icon fails.

   basic is the BUFF glyph and mini the ordinary-camp one, which is the
   opposite of what the names suggest. Confirmed against an in-game
   screenshot: the two buff camps carry a distinct tan marker while every
   other camp is one of the small amber diamonds. Worth stating plainly,
   because "basic" reads like the default and picking it for everything
   would put buff markers on all twelve camps. */
const MAP_JUNGLE_ICON = {
  buff:        "junglecampbasic.png",   /* Ancient Golem — a buff */
  red:         "junglecampbasic.png",   /* Lizard Elder  — a buff */
  wraiths:     "junglecampmini.png",
  wolves:      "junglecampmini.png",
  golems:      "junglecampmini.png",
  greatwraith: "junglecampmini.png"
};
const MAP_PIT_ICON = {
  baron:  "junglecampbaron.png",
  dragon: "junglecampdragon.png"
};
function mapCampIcon(key){
  const f = MAP_JUNGLE_ICON[String(key).replace(/^(blue|red)-/, "")];
  return f ? `${MAP_ICON_MINIMAP}/${f}` : "";
}
function mapPitIcon(key){
  const f = MAP_PIT_ICON[key];
  return f ? `${MAP_ICON_MINIMAP}/${f}` : "";
}

/* ---- the markers, over whichever backdrop ----

   The backdrop is a SKIN, not the map. Camps and pits were measured as
   fractions of Riot's image, so the same marker layer sits correctly on the
   photo and on the schematic without a single number changing — which is the
   point of having measured fractions rather than drawn coordinates.

   mapFigure("photo") needs MAP_IMAGE to be reachable from this domain.
   mapFigure("schematic") needs nothing. Guides store neither: a plan refers
   to places by name, so switching the skin later cannot invalidate one. */
/* How big each icon draws, in the 0-1000 square. Kept here rather than in
   the stylesheet because the limit is geometric, not aesthetic: the two
   nexus turrets sit about 31 units apart, so a turret icon much wider than
   that stops reading as two buildings.

   Camps are one size rather than scaled per camp. Varying them by monster
   count was a nice idea that made the map look uneven next to structures
   that are all the same size, and the difference carried no information a
   reader could use. */
const MAP_ICON_R = {turret: 20, inhibitor: 25, nexus: 31, camp: 21, pit: 29};

function mapOverlaySvg(){
  const u = "o" + (++MAP_UID);
  /* A FEATHERED mask, not a hard clip. Clipping a portrait to a circle
     leaves a cut edge, and a cut edge is what makes a marker read as
     something stuck on top of the map. Fading the last quarter of the
     radius lets the monster art dissolve into the ground it stands on.
     SOLID is where the fade starts; anything drawn under the icon has to
     stay inside that or it shows through the soft part. */
  const SOLID = 0.74;
  const defs = `<defs>
    <radialGradient id="${u}-fade" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="${SOLID}" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="${u}-cc" maskContentUnits="objectBoundingBox">
      <rect x="0" y="0" width="1" height="1" fill="url(#${u}-fade)"/>
    </mask>
  </defs>`;
  /* onerror is what makes the "degrades to the disc" promise below TRUE. It
     was only ever a comment: the backing shape sits at opacity .001 and a
     failed icon left the browser's broken-image glyph sitting on top of it.
     Rendering the map with the icon host unreachable is what showed this --
     thirty torn-page glyphs. Dropping the image and lighting the shape back
     up turns an outage into a plain marker map. */
  const pic = (href, x, y, r, soft) => href
    ? `<image href="${href}" x="${x - r}" y="${y - r}" width="${r * 2}" height="${r * 2}"
         preserveAspectRatio="xMidYMid slice"${soft ? ` mask="url(#${u}-cc)"` : ""}
         loading="lazy"
         onerror="this.parentNode.setAttribute('data-noicon','1');this.remove()"/>`
    : "";

  /* Camps and pits are UI glyphs with their own silhouette and a
     transparent surround, exactly like the structures -- so no feather mask
     and no colour grading.

     NO LABELS. The glyphs are generic, so the map no longer says in writing
     which camp is which; position does that, as it does in the game. The
     disc beneath is all that is left of the fallback -- without a letter to
     carry, it is just a marker that something is there when an icon fails. */
  const camp = c => `<g class="m-camp" data-place="${c.key}">
      <circle cx="${c.x}" cy="${c.y}" r="${MAP_ICON_R.camp * 0.52}"></circle>
      ${pic(mapCampIcon(c.key), c.x, c.y, MAP_ICON_R.camp, false)}
    </g>`;
  const pit = p => `<g class="m-pit" data-place="${p.key}">
      <circle cx="${p.x}" cy="${p.y}" r="${MAP_ICON_R.pit * 0.52}"></circle>
      ${pic(mapPitIcon(p.key), p.x, p.y, MAP_ICON_R.pit, false)}
    </g>`;
  /* Structures keep a hard edge: their icons are UI glyphs with their own
     silhouette and transparent surround, so there is no rectangle to hide
     and feathering would only dim them. */
  const struct = t => {
    const r = MAP_ICON_R[t.kind] || 20;
    const b = t.kind === "turret" ? 9 : t.kind === "inhibitor" ? 11 : 15;
    const shape = t.kind === "turret"
      ? `<rect x="${t.x - b}" y="${t.y - b}" width="${b * 2}" height="${b * 2}" rx="2.5"/>`
      : `<path d="M ${t.x} ${t.y - b} L ${t.x + b} ${t.y} L ${t.x} ${t.y + b} L ${t.x - b} ${t.y} Z"/>`;
    return `<g class="m-struct ${t.side} ${t.kind}" data-place="${t.key}">${shape}
      ${pic(mapStructIcon(t), t.x, t.y, r, false)}</g>`;
  };
  return `<svg class="m-overlay" viewBox="0 0 ${MAP_SIZE} ${MAP_SIZE}"
     xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    ${defs}
    ${MAP_STRUCTURES.map(struct).join("")}
    ${MAP_PITS.map(pit).join("")}
    ${MAP_CAMPS.map(camp).join("")}
  </svg>`;
}

/* The whole figure: a backdrop with the markers over it. A plan layer goes
   in after the overlay, in the same viewBox. */
function mapFigure(skin, planSvg){
  const back = skin !== "schematic"
    ? `<img class="m-photo" src="${MAP_IMAGE}" alt="Season 3 Summoner's Rift" loading="lazy">`
    : mapTerrainSvg();
  return `<div class="m-fig" data-skin="${skin === "schematic" ? "schematic" : "photo"}">
    ${back}${mapOverlaySvg()}${planSvg || ""}
  </div>`;
}

/* ---- drawing a plan over the map ----

   A plan is author data, so this function is the second place (after
   normaliseGuide) where a hostile value could reach the page. It does not
   trust its input: colours and marker kinds are looked up in tables rather
   than interpolated, unknown place keys are dropped rather than rendered as
   NaN coordinates, and the only author string that reaches the page is the
   route label, escaped.

   Routes are numbered. A jungle clear is an ORDER as much as a path, and a
   line alone cannot say which end it starts from. */
const PLAN_COLOUR_HEX = {
  gold:   "#e0a84a",
  blue:   "#4f93d8",
  red:    "#d8574a",
  green:  "#5fb87a",
  purple: "#9a7fd0"
};
/* Riot's own ward icons, RECOLOURED AND SELF-HOSTED.

   They could not be hotlinked as they ship. The filenames name the ward TYPE
   -- "green" is the trinket, "pink" the control ward, from the days those
   were the item colours -- while the pixels carry the TEAM colour, and both
   ally versions are blue. So the pair that reads as green-and-pink in the
   filename arrives as two blue icons, which is how they first looked here.

   tools/tint-wards.py recolours each one and writes the copy in art/. The
   silhouettes are Riot's and untouched -- a totem for the trinket, an eye
   for the control ward -- which is the part worth having; only the hue
   changes. Re-run that script to change a colour or refresh the source.

   This makes them the second and third mirrored Riot assets after the map
   plate. Unavoidable here: the edit IS the point, so there is nothing to
   link to. */

/* A step is a named place or a raw point. Unknown names resolve to null and
   the caller drops them, which is what keeps a guide written against an
   older map from drawing a route through the top-left corner. */
function mapPoint(step){
  if(!step) return null;
  if(step.place){
    const p = mapPlaces().find(q => q.key === step.place);
    return p ? {x: p.x, y: p.y} : null;
  }
  if(Number.isFinite(step.x) && Number.isFinite(step.y))
    return {x: step.x * MAP_SIZE, y: step.y * MAP_SIZE};
  return null;
}

function mapPlanSvg(plan){
  if(!plan) return "";
  const esc = s => String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
  const col = c => PLAN_COLOUR_HEX[c] || PLAN_COLOUR_HEX.gold;
  const u = "p" + (++MAP_UID);

  /* routes: a smooth line, then a numbered pip at every stop */
  /* The colour name is resolved to a KNOWN one first and that is what gets
     used everywhere after. Looking it up for the stroke while interpolating
     the raw value into the marker-end URL would leave the enum guarding one
     use and not the other -- which is exactly what this did until a test
     fed it a colour with a quote in it. */
  const safeCol = c => PLAN_COLOUR_HEX[c] ? c : "gold";
  /* ONE STOP STILL DRAWS. This used to return nothing below two points, so
     in the editor the first click of a path placed a stop and showed
     nothing -- the path only appeared on the second click, which read as
     the first one having missed. A single stop draws its pip and no line;
     there is simply no line to draw yet. (normaliseGuide still drops
     one-stop paths when a guide is published, which is right: a path with
     one stop is unfinished, not a path.) */
  /* ---- coincident glyphs ----
     Two things on one spot is not an edge case, it is how people plan: a
     route ends where the next begins, and a danger marker goes on the camp
     the route paths through. Rendering a published demo showed five exact
     collisions across five plans -- stop 3 vanished under a danger triangle
     and stop 5 under the next route's stop 1. The hidden one is always the
     one drawn first, so the sequence loses a number with nothing to show
     that it did.

     Items are slotted in DRAW ORDER, which gives route stops priority: the
     numbered pip keeps the camp it names and the annotation steps aside.
     The route LINE still joins the true points -- only the glyph moves, so
     the path a reader traces is unchanged. */
  /* 34 = a pip radius (15) plus a marker half-width (19), so a displaced
     glyph sits just clear of the one that kept the spot rather than lapping
     over its edge, which read as a mistake at 28. */
  const SPREAD_R = 34;
  const taken = new Map();
  /* 12 units ~ the glyph radii here, so this catches overlap rather than
     mere proximity; identical places collide exactly whatever the grid. */
  const slot = q => {
    const k = Math.round(q.x / 12) + ":" + Math.round(q.y / 12);
    const n = taken.get(k) || 0;
    taken.set(k, n + 1);
    return n;
  };
  /* ring out, starting up-right, so the first displaced glyph lands where
     a reader is least likely to have a route line already */
  const nudge = (q, n) => {
    if(!n) return q;
    const ring = Math.ceil(n / 4), a = (-40 + ((n - 1) % 4) * 90) * Math.PI / 180;
    return {x: q.x + Math.cos(a) * SPREAD_R * ring,
            y: q.y + Math.sin(a) * SPREAD_R * ring};
  };

  const routes = (plan.routes || []).map((r, ri) => {
    const pts = (r.steps || []).map(mapPoint).filter(Boolean);
    if(!pts.length) return "";
    const c = safeCol(r.colour);
    const pips = pts.map((p0, i) => {
      const p = nudge(p0, slot(p0));
      return `<g class="pl-pip">
        <circle cx="${p.x}" cy="${p.y}" r="15" fill="${col(c)}"/>
        <text x="${p.x}" y="${p.y + 6}">${i + 1}</text></g>`;
    }).join("");
    let line = "";
    if(pts.length > 1){
      const d = pts.map((p, i) => (i ? "L" : "M") + p.x.toFixed(1) + " " + p.y.toFixed(1)).join(" ");
      line = `<path class="pl-line-under" d="${d}"/>
        <path class="pl-line" d="${d}" stroke="${col(c)}"
              marker-end="url(#${u}-arrow-${c})"/>`;
    }
    return `<g class="pl-route" data-route="${ri}">${line}${pips}</g>`;
  }).join("");

  /* Marker sizes live here rather than in the stylesheet because an SVG
     shape is drawn from coordinates, not styled into one. */
  const MR = 19;
  const marks = (plan.markers || []).map(m => {
    const p0 = mapPoint(m);
    if(!p0) return "";
    const p = nudge(p0, slot(p0));
    /* Wards keep the game's own icons, which are already green for a normal
       ward and pink for a control ward -- so the colour coding is Riot's and
       matches what a player sees in game. */
    const icon = MAP_WARD_ICON[m.kind];
    if(icon)
      return `<image class="pl-mark" href="${icon}" x="${p.x - MR}" y="${p.y - MR}"
                width="${MR * 2}" height="${MR * 2}" preserveAspectRatio="xMidYMid meet"/>`;
    if(m.kind === "danger")
      return `<g class="pl-mark pl-danger"><path d="M ${p.x} ${p.y - MR - 2}
                L ${p.x + MR + 1} ${p.y + MR - 5} L ${p.x - MR - 1} ${p.y + MR - 5} Z"/>
                <text x="${p.x}" y="${p.y + MR - 8}">!</text></g>`;
    /* A flag, not a ring: a target you are heading for reads as a flag
       planted on it, and the two concentric circles it replaced were easy to
       mistake for a camp marker at this size. */
    if(m.kind === "objective")
      return `<g class="pl-mark pl-obj">
                <path class="pl-pole" d="M ${p.x - 8} ${p.y + MR} L ${p.x - 8} ${p.y - MR}"/>
                <path class="pl-flag" d="M ${p.x - 8} ${p.y - MR} L ${p.x + MR - 1} ${p.y - 7}
                      L ${p.x - 8} ${p.y + 3} Z"/></g>`;
    /* A LABEL, not a glyph. Freehand ink can show where something happens
       but never what it is, so the drawing needs words next to it -- which
       is the job the shove and freeze symbols were doing badly. Escaped: an
       author typed it. */
    if(m.kind === "text")
      /* An empty label is one just placed and not yet typed into. It draws
         nothing rather than an empty element, so the map never carries an
         invisible node and a check for "is anything drawn" means what it
         says. */
      return m.text ? `<text class="pl-text" x="${p.x}" y="${p.y + 6}">${esc(m.text)}</text>` : "";
    return `<g class="pl-mark pl-note"><circle cx="${p.x}" cy="${p.y}" r="12"/></g>`;
  }).join("");

  const ink = (plan.ink || []).map(k => {
    const pts = (k.pts || []);
    if(pts.length < 2) return "";
    const d = pts.map((q, i) => (i ? "L" : "M") + (q[0] * MAP_SIZE).toFixed(1)
                + " " + (q[1] * MAP_SIZE).toFixed(1)).join(" ");
    const w = Math.max(2, Math.min(40, Number(k.w) || 8));
    return `<path class="pl-ink" d="${d}" stroke="${col(safeCol(k.colour))}" stroke-width="${w}"/>`;
  }).join("");

  /* one arrowhead per colour actually used, so the defs stay small */
  const used = [...new Set((plan.routes || []).map(r => safeCol(r.colour)))];
  const defs = used.map(c =>
    `<marker id="${u}-arrow-${c}" viewBox="0 0 10 10" refX="8" refY="5"
       markerWidth="5" markerHeight="5" orient="auto-start-reverse">
       <path d="M 0 0 L 10 5 L 0 10 z" fill="${col(c)}"/></marker>`).join("");

  return `<svg class="m-plan" viewBox="0 0 ${MAP_SIZE} ${MAP_SIZE}"
     xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>${defs}</defs>
    ${ink}${routes}${marks}
  </svg>`;
}

/* The legend a plan needs: which coloured line is which. Returns "" when
   there is nothing to say, so the caller can drop the whole strip. */
function mapPlanLegend(plan){
  const esc = s => String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const rows = (plan && plan.routes || []).filter(r => r.label);
  if(!rows.length) return "";
  return `<ul class="m-legend">${rows.map(r =>
    `<li><i style="background:${PLAN_COLOUR_HEX[r.colour] || PLAN_COLOUR_HEX.gold}"></i>${esc(r.label)}</li>`
  ).join("")}</ul>`;
}
</script>
<script>
window.onerror = (m, f, l) => {
  document.getElementById("head").textContent = "script error: " + m + " (line " + l + ")";
  document.getElementById("head").className = "bad";
};
const out = [];
let bad = 0;
const t = (name, fn) => {
  let pass = false, note = "";
  try { const r = fn(); pass = r === true; if(r !== true && r !== false) note = " — " + r; }
  catch(e){ note = " — threw: " + e.message; }
  if(!pass) bad++;
  out.push((pass ? "ok   " : "FAIL ") + name + note);
};

const plan = {
  routes:[{colour:"blue", label:"Levels 1-4",
           steps:[{place:"blue-buff"},{place:"blue-wolves"},{place:"blue-wraiths"}]}],
  markers:[{place:"blue-wraiths",kind:"ward"},{place:"red-buff",kind:"pink"},
           {place:"baron",kind:"danger"},{place:"dragon",kind:"objective"},
           {x:0.5,y:0.3,kind:"text",text:"freeze here"}],
  ink:[{colour:"red",w:9,pts:[[0.2,0.2],[0.4,0.4]]}]
};
const stage = document.getElementById("stage");
stage.innerHTML = mapFigure("photo", mapPlanSvg(plan)) +
  '<input class="plan-text-input" type="text" value="typing" style="left:50%;top:30%">';

const css$ = (sel, prop) => getComputedStyle(document.querySelector(sel)).getPropertyValue(prop);

/* --- the class of bug the node harnesses cannot see --- */
t("the label typing box really computes a transparent background", () => {
  const bg = css$(".plan-text-input", "background-color");
  return /rgba\(0, 0, 0, 0\)|transparent/.test(bg) ? true : "computed " + bg;
});
t("  and is not stretched by the page's generic input width", () => {
  const w = parseFloat(css$(".plan-text-input", "width"));
  return w < 400 ? true : "computed width " + w + "px";
});
t("map labels compute as not bold", () => {
  const fw = css$(".pl-text", "font-weight");
  return (fw === "400" || fw === "normal") ? true : "computed " + fw;
});
t("a hidden tool group really computes display:none", () => {
  const g = document.createElement("div");
  g.className = "pt-group"; g.hidden = true; document.body.appendChild(g);
  const d = getComputedStyle(g).display; g.remove();
  return d === "none" ? true : "computed " + d;
});

/* --- geometry: does the overlay line up with the map --- */
t("the map figure renders square", () => {
  const r = document.querySelector(".m-fig").getBoundingClientRect();
  return Math.abs(r.width - r.height) < 2 ? true : r.width + "x" + r.height;
});
/* The real invariant is not "plan matches figure" -- it is that the surface
   clicks are measured against, the art, and the snap preview all occupy ONE
   box. A 1px border on .m-fig broke this: inset:0 resolves against the
   padding box, so the art shrank while the click surface did not. */
const same = (a, b) => Math.abs(a.width-b.width) < 0.5 && Math.abs(a.height-b.height) < 0.5 &&
                       Math.abs(a.top-b.top) < 0.5 && Math.abs(a.left-b.left) < 0.5;
const say = (a, b) => Math.round(a.width) + "@" + a.left.toFixed(1) +
                      " vs " + Math.round(b.width) + "@" + b.left.toFixed(1);
t("the plan layer sits exactly on the map art", () => {
  const a = document.querySelector(".m-photo").getBoundingClientRect();
  const b = document.querySelector(".m-plan").getBoundingClientRect();
  return same(a, b) ? true : say(a, b);
});
t("the art fills the frame clicks are measured against", () => {
  const a = document.querySelector("#stage").getBoundingClientRect();
  const b = document.querySelector(".m-photo").getBoundingClientRect();
  return same(a, b) ? true : say(a, b);
});
t("the snap preview shares that same box", () => {
  const g = document.createElement("div");   /* stand-in for .plan-ghost: a */
  g.className = "plan-ghost";                /* sibling of .m-fig, inset:0   */
  document.querySelector("#stage").appendChild(g);
  const a = g.getBoundingClientRect();
  const b = document.querySelector(".m-photo").getBoundingClientRect();
  g.remove();
  return same(a, b) ? true : say(a, b);
});
t("a route stop lands on the camp it names", () => {
  /* the first pip must sit where blue-buff is drawn */
  const camp = MAP_CAMPS.find(c => c.key === "blue-buff");
  const fig = document.querySelector(".m-photo").getBoundingClientRect();
  const pip = document.querySelector(".pl-pip circle").getBoundingClientRect();
  const wantX = fig.left + camp.x / MAP_SIZE * fig.width;
  const wantY = fig.top  + camp.y / MAP_SIZE * fig.height;
  const gotX = pip.left + pip.width/2, gotY = pip.top + pip.height/2;
  const off = Math.hypot(gotX - wantX, gotY - wantY);
  return off < 0.6 ? true : "off by " + off.toFixed(1) + "px";
});
t("the ward icons actually load", () => {
  const imgs = [...document.querySelectorAll(".pl-mark")].filter(e => e.tagName === "image");
  return imgs.length >= 2 ? true : "found " + imgs.length;
});
t("the author's text label is drawn", () => {
  const el = document.querySelector(".pl-text");
  return el && el.textContent === "freeze here" ? true : "missing";
});
t("every plan colour resolves to a real colour", () => {
  const stroke = document.querySelector(".pl-line").getAttribute("stroke");
  return /^#[0-9a-f]{6}$/i.test(stroke) ? true : "stroke " + stroke;
});

/* dump the real boxes so a mismatch names its own cause */
const box = sel => { const r = document.querySelector(sel).getBoundingClientRect();
  const cs = getComputedStyle(document.querySelector(sel));
  return sel + "  " + r.width.toFixed(1) + "x" + r.height.toFixed(1) +
    "  at " + r.left.toFixed(1) + "," + r.top.toFixed(1) +
    "  border " + cs.borderTopWidth + "/" + cs.borderLeftWidth +
    "  pad " + cs.paddingTop + "/" + cs.paddingLeft +
    "  pos " + cs.position + "  inset " + cs.top + "/" + cs.left; };
out.push("");
["#stage", ".m-fig", ".m-photo", ".m-overlay", ".m-plan"].forEach(se => {
  try { out.push("     " + box(se)); } catch(e){ out.push("     " + se + " missing"); }
});

/* The preview surface fetches nothing from the network, which reproduces an
   icon-host outage exactly. Give the browser a moment to fail the thirty
   requests, then check the map did not fill with broken-image glyphs. */
const late = () => {
  const n0 = out.length, b0 = bad;
  t("a dead icon host leaves no broken images", () => {
    const left = document.querySelectorAll(".m-struct image, .m-camp image, .m-pit image").length;
    return left === 0 ? true : left + " failed icons still in the document";
  });
  t("  and the markers underneath come back", () => {
    const lit = document.querySelectorAll("[data-noicon]").length;
    if(!lit) return "nothing was marked as missing an icon";
    const o = getComputedStyle(document.querySelector(".m-struct[data-noicon] rect, .m-struct[data-noicon] path")).opacity;
    return Number(o) > .9 ? true : "backing shape still at opacity " + o;
  });
  document.getElementById("res").innerHTML = out
    .map(l => '<div class="' + (l.startsWith("FAIL") ? "bad" : "ok") + '">' + l + "</div>").join("");
  document.getElementById("head").textContent =
    bad ? (bad + " FAILED of " + out.length) : ("all " + out.length + " browser checks passed");
  document.getElementById("head").className = bad ? "bad" : "ok";
};
setTimeout(late, 1200);

document.getElementById("res").innerHTML = out
  .map(l => '<div class="' + (l.startsWith("FAIL") ? "bad" : "ok") + '">' + l + "</div>").join("");
document.getElementById("head").textContent =
  bad ? (bad + " FAILED of " + out.length) : ("all " + out.length + " browser checks passed");
document.getElementById("head").className = bad ? "bad" : "ok";
</script></body></html>
