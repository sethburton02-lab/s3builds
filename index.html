<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S3 Builds — League Classic builds &amp; guides</title>
<meta name="description" content="Community-made builds and guides for League of Legends Classic, with the mode's own champions, items, runes and masteries.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="S3 Builds">
<meta property="og:title" content="S3 Builds — League Classic builds &amp; guides">
<meta property="og:description" content="Community-written build guides for League of Legends Classic, with the mode's own champions, items, runes and masteries.">
<meta property="og:image" content="https://s3builds.net/logo-512.png">
<meta name="twitter:card" content="summary">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="site.css?v=94">
<style>
  /* Everything on this page is real: the site's chrome, the mode's own
     champion art, and whatever has actually been published. There is no
     sample content — an empty site says so. */

  .home-wrap{max-width:1240px;margin:0 auto;padding:0 20px}

  /* ---------- hero ---------- */
  .h-hero{padding:32px 0 24px;border-bottom:1px solid var(--line)}
  .h-hero h1{margin:0 0 10px;font-family:var(--font-head);font-size:38px;
    font-weight:400;line-height:1.15;color:var(--title);max-width:20ch}
  .h-hero p{margin:0 0 18px;font-size:18px;line-height:1.6;color:var(--muted);max-width:62ch}
  .h-cta{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .h-cta .btn{font-size:15px;padding:10px 20px}
  .h-note{font-size:13.5px;color:var(--muted-2)}

  /* A draft in progress is otherwise invisible unless you happen to open
     the creator, so the site says so where you land. */
  .h-resume{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    margin:0 0 18px;padding:12px 16px;border:1px solid var(--gold);
    border-radius:var(--radius);background:rgba(200,163,85,.16)}
  .h-resume b{font-family:var(--font-head);font-weight:400;font-size:16px;color:var(--title)}
  .h-resume span{font-size:14px;color:var(--muted)}
  .h-resume .btn{margin-left:auto}

  /* ---------- section headings ---------- */
  .h-sec{padding:24px 0}
  .h-sec + .h-sec{padding-top:6px}
  .h-hd{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}
  .h-hd h2{margin:0;padding:8px 22px;display:inline-block;font-family:var(--font-jade);
    font-size:26px;font-weight:400;color:#600;white-space:nowrap;
    background:url("art/header_flame.png") center/100% 100% no-repeat}
  .h-hd .more{margin-left:auto;font-size:14.5px;color:var(--gold-hi)}
  .h-hd .more:hover{text-decoration:underline}

  /* ---------- filters ---------- */
  .h-filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .h-search{position:relative;flex:1;min-width:200px;max-width:320px}
  .h-search input{width:100%;background:#fff;border:1px solid var(--line);color:var(--text);
    padding:8px 12px;border-radius:var(--radius);font-size:14.5px;font-family:inherit;outline:none}
  .h-search input:focus{border-color:#c8aa6e;box-shadow:0 0 0 2px hsla(43,47%,60%,.45)}
  .h-pills{display:flex;gap:5px;flex-wrap:wrap}
  .h-pills button{padding:6px 12px;border-radius:var(--radius);border:1px solid var(--line);
    background:hsla(43,47%,60%,.3);color:var(--muted);font-family:var(--font-head);
    font-size:13.5px;transition:.13s}
  .h-pills button:hover{color:var(--text);background:hsla(43,47%,60%,.5)}
  .h-pills button.on{background:var(--btn);border-color:hsla(0,0%,100%,.2);color:#f0e6d2}
  .h-sort{margin-left:auto}
  .h-sort select{width:auto;padding:7px 10px;font-size:14px}

  /* ---------- guide cards ---------- */
  .h-guides{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
  .h-guide{position:relative;display:flex;gap:12px;padding:13px;border:1px solid var(--line);
    border-radius:var(--radius);background:hsla(43,47%,60%,.26);transition:.14s}
  .h-guide:hover{background:hsla(43,47%,60%,.42);border-color:var(--gold)}
  .h-guide .por{width:56px;height:56px;border-radius:8px;flex:none;
    border:1px solid var(--line);background:var(--bg-2);object-fit:cover}
  .h-guide .meta{min-width:0;flex:1}
  /* Only the title needs to keep clear of the corner tally — the byline and
     blurb sit below it, so padding the whole column would waste width on
     every line for the sake of the first. */
  .h-guide .meta > b{display:block;font-family:var(--font-head);font-size:17px;font-weight:400;
    line-height:1.25;color:var(--text);padding-right:40px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .h-guide .by{font-size:13px;color:var(--muted);margin-top:3px}
  .h-guide .blurb{margin:6px 0 0;font-size:13.5px;line-height:1.5;color:var(--muted);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .h-guide .tag{margin-left:6px;vertical-align:1px}
  .h-guide .edited{color:var(--gold-hi)}
  /* Corner-set rather than a column of its own. A full-height 46px column
     with a divider spent a lot of card on one number; up here it costs the
     card nothing but the title's last few characters. */
  .h-guide .tally{position:absolute;top:9px;right:10px;display:inline-flex;
    align-items:center;gap:4px;line-height:1;color:var(--gold-hi)}
  .h-guide .tally .arrow{width:0;height:0;border-left:4.5px solid transparent;
    border-right:4.5px solid transparent;border-bottom:6px solid currentColor}
  .h-guide .tally b{font-family:var(--font-head);font-size:14px;font-weight:400;
    font-variant-numeric:tabular-nums}
  .h-guide .tally.none{color:var(--muted-2);opacity:.55}

  .h-empty{padding:26px;border:1px dashed var(--line);border-radius:var(--radius);
    background:hsla(43,47%,60%,.18);text-align:center}
  .h-empty p{margin:0 0 14px;font-size:16px;color:var(--muted)}
  .h-empty p:last-child{margin-bottom:0}

  /* ---------- champion strip ---------- */
  .h-champs{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:7px}
  .h-champ{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;
    padding:7px 4px;border:1px solid transparent;border-radius:var(--radius);transition:.13s}
  .h-champ:hover{border-color:var(--line);background:hsla(43,47%,60%,.35)}
  .h-champ img{width:52px;height:52px;border-radius:8px;border:1px solid var(--line);
    object-fit:cover;background:var(--bg-2)}
  .h-champ span{font-size:11.5px;line-height:1.2;text-align:center;color:var(--muted);
    max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .h-champ:hover span{color:var(--text)}
  /* How many guides this champion has. Only drawn when there are some, so
     the strip doesn't read as a wall of zeroes. */
  .h-champ .n{position:absolute;top:3px;right:3px;min-width:18px;padding:0 4px;
    border-radius:99px;background:var(--btn);border:1px solid hsla(0,0%,100%,.2);
    color:#f0e6d2;font-size:10.5px;font-weight:700;line-height:16px;text-align:center}

  /* ---------- reference tiles ---------- */
  .h-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
  .h-tile{padding:16px 18px;border:1px solid var(--line);border-radius:var(--radius);
    background:hsla(43,47%,60%,.26);transition:.14s}
  .h-tile:hover{background:hsla(43,47%,60%,.42);border-color:var(--gold)}
  .h-tile b{display:block;font-family:var(--font-head);font-size:19px;font-weight:400;
    color:var(--title);margin-bottom:4px}
  .h-tile span{font-size:14px;line-height:1.5;color:var(--muted)}

  .h-about{padding:20px 22px;border:1px solid var(--line-soft);border-radius:var(--radius);
    background:hsla(43,47%,60%,.18)}
  .h-about p{margin:0 0 10px;font-size:16px;line-height:1.65;color:var(--text)}
  .h-about p:last-child{margin-bottom:0}
  .h-about .small{font-size:14px;color:var(--muted)}

  @media(max-width:640px){
    .h-hero h1{font-size:29px}
    .h-hero p{font-size:16px}
    .h-sort{margin-left:0}
  }
</style>
</head>
<body>
<div id="main"></div>

<script src="site.js?v=94"></script>
<script src="data-rune-icons.js?v=94"></script>
<script src="data-runes.js?v=94"></script>
<script src="guide-sanitise.js?v=94"></script>
<script src="config.js?v=94"></script>
<script src="guide-store.js?v=94"></script>
<script src="guide-load.js?v=94"></script>
<script>
renderChrome("Guides");

/* ============================================================
   HOME

   Three questions a visitor arrives with, in order:
     · is there anything here?      -> counts and the guide list
     · anything for MY champion?    -> search, filters, and the strip
     · was I in the middle of one?  -> the resume banner

   Everything is drawn from the published store and the mode's own roster.
   Filtering happens in memory over a list that is already loaded, so it
   is instant and needs no round trip.
   ============================================================ */

const HOME_GUIDES = 8;
const HOME_CHAMPS = 28;

/* What the reader has narrowed to. Kept in one object so a repaint is a
   single call and no control has to know about the others. `limit` is here
   too: "show everything" is a filter like any other, and putting it in the
   same object means one repaint path rather than two. */
const q = {text: "", role: "", tag: "", sort: "new", limit: HOME_GUIDES};

const ROLES = ["Top", "Jungle", "Mid", "ADC", "Support"];
const SORTS = [["new", "Newest"], ["top", "Top rated"],
               ["updated", "Recently updated"], ["title", "A–Z"]];

/* ---------- the guide list ---------- */

function filtered(){
  const text = q.text.trim().toLowerCase();
  let rows = listPublished();

  if(q.role) rows = rows.filter(g => g.role === q.role);
  if(q.tag)  rows = rows.filter(g => g.tag === q.tag);
  if(text)   rows = rows.filter(g =>
    (g.title || "").toLowerCase().includes(text) ||
    (g.champ || "").toLowerCase().includes(text) ||
    (g.author || "").toLowerCase().includes(text));

  if(q.sort === "title")   rows = [...rows].sort((a, b) => a.title.localeCompare(b.title));
  /* An edited guide never resurfaced under "newest", because that sorts on
     when it was first published. This is the other question. */
  else if(q.sort === "updated")
    rows = [...rows].sort((a, b) => (b.updated || b.at) - (a.updated || a.at));
  /* Ties broken by date, so a list where nothing has been voted on yet is
     still newest-first. Sort is stable and listPublished already hands them
     over in that order, so this is stating the intent rather than changing
     the outcome — but it stops the order depending on a detail of a
     function two files away. */
  else if(q.sort === "top")
    rows = [...rows].sort((a, b) => (b.votes || 0) - (a.votes || 0) || b.at - a.at);
  return rows;
}

/* The upvote count, in its own column at the end of the card. Reading it is
   the point — voting happens on the guide itself, since the card is a link
   and a button inside a link is a fight nobody wins. Zero is drawn rather
   than left blank: a column of numbers with holes in it looks broken, and
   "nobody has voted yet" is real information. */
function tallyHtml(n){
  return `<span class="tally${n ? "" : " none"}" title="${
    n === 1 ? "1 upvote" : n + " upvotes"}">
    <span class="arrow" aria-hidden="true"></span>
    <b>${n}</b>
  </span>`;
}

function guideCardHtml(r){
  const c = (CHAMPIONS || []).find(x => x.name === r.champ);
  const tag = r.tag && TAGS.find(t => t.k === r.tag);
  return `<a class="h-guide" href="guide.html?g=${encodeURIComponent(r.slug)}">
    ${c ? champImgTag(c, "por") : `<span class="por"></span>`}
    <div class="meta">
      <b>${esc(r.title)}${tag ? `<span class="tag ${tag.k}">${tag.label}</span>` : ""}</b>
      <div class="by">${esc(r.champ || "No champion")}${r.role ? " · " + esc(r.role) : ""}${
        /* The byline links to the author. Built from the NAME rather than
           the id because that is what author.html is addressed by, and a
           link a reader can read is worth more than one they can't. */
        r.author ? ` · by <a class="byline-link" href="author.html?u=${
          encodeURIComponent(r.author)}">${esc(r.author)}</a>` : ""}${
        r.updated ? ` · <span class="edited">edited</span>` : ""}</div>
      ${r.blurb ? `<p class="blurb">${esc(r.blurb)}</p>` : ""}
    </div>
    ${tallyHtml(r.votes || 0)}
  </a>`;
}

function guideListHtml(){
  const total = listPublished().length;
  const rows = filtered();

  if(!total) return `<div class="h-empty">
    <!-- The old wording here referred to a vault; it survived the rename
         because the word was lowercase and the pass only replaced the
         proper noun. -->
    <p>No guides published yet. Yours would be the first.</p>
    <a class="btn btn-gold" href="create.html">Write the first one</a>
  </div>`;

  if(!rows.length) return `<div class="h-empty">
    <p>Nothing matches that${q.text ? ` — no guide mentions “${esc(q.text.trim())}”` : ""}.</p>
    <p><button type="button" class="btn btn-sm" data-clear>Clear the filters</button></p>
  </div>`;

  /* "See them all" used to link to guide.html?list=1 — but that page lists
     only guides you wrote, so from a home list of everyone's it would have
     dropped the reader somewhere smaller than where they started. Showing
     more is a local change; it stays here. */
  const shown = rows.slice(0, q.limit);
  return `<div class="h-guides">${shown.map(guideCardHtml).join("")}</div>`
    + (rows.length > shown.length
        ? `<p class="h-note" style="margin:12px 0 0">Showing ${shown.length} of ${rows.length}.
             <button type="button" class="btn btn-sm" data-all>Show them all</button></p>` : "");
}

/* The whole Guides section, so the first paint and every repaint after a
   filter move draw the same thing from one definition. */
function guidesSectionHtml(){
  const any = listPublished().length;
  return `<div class="h-hd">
      <h2>Guides</h2>
      ${any ? `<a class="more" href="guide.html?list=1">My guides →</a>` : ""}
    </div>${filtersHtml()}${guideListHtml()}`;
}

function filtersHtml(){
  if(!listPublished().length) return "";
  return `<div class="h-filters">
    <span class="h-search">
      <input type="text" id="hSearch" placeholder="Search guides, champions, authors…"
        value="${esc(q.text)}" aria-label="Search guides">
    </span>
    <span class="h-pills">
      <button type="button" data-role="" class="${q.role ? "" : "on"}">All roles</button>
      ${ROLES.map(r =>
        `<button type="button" data-role="${r}" class="${q.role === r ? "on" : ""}">${r}</button>`).join("")}
    </span>
    <span class="h-pills">
      ${TAGS.map(t =>
        `<button type="button" data-tag="${t.k}" class="${q.tag === t.k ? "on" : ""}"
          >${t.label}</button>`).join("")}
    </span>
    <span class="h-sort">
      <select id="hSort" aria-label="Sort guides">
        ${SORTS.map(([k, label]) =>
          `<option value="${k}" ${q.sort === k ? "selected" : ""}>${label}</option>`).join("")}
      </select>
    </span>
  </div>`;
}

/* ---------- champions ---------- */

function champStripHtml(){
  const counts = guideCountsByChampion();
  const roster = CHAMPIONS || [];
  if(!roster.length) return `<p class="h-note">Loading the roster…</p>`;

  /* Champions with guides first — an alphabetical first-24 is the same
     twenty-four faces forever and tells a visitor nothing. */
  const list = [...roster].sort((a, b) =>
    (counts[b.name] || 0) - (counts[a.name] || 0) || a.name.localeCompare(b.name)
  ).slice(0, HOME_CHAMPS);

  return `<div class="h-champs">${list.map(c => {
    const n = counts[c.name] || 0;
    return `<a class="h-champ" href="champion.html?c=${encodeURIComponent(c.id)}"
      title="${esc(c.name)}${n ? ` — ${n} guide${n > 1 ? "s" : ""}` : ""}">
      ${champImgTag(c, "")}
      ${n ? `<span class="n">${n}</span>` : ""}
      <span>${esc(c.name)}</span>
    </a>`;
  }).join("")}</div>`;
}

/* ---------- the draft you left behind ---------- */

function resumeHtml(){
  let d = null;
  try{ d = JSON.parse(localStorage.getItem(GUIDE_DRAFT_KEY) || "null"); }catch(_){}
  if(!d) return "";
  const words = String(d.title || "").trim();
  /* An untouched draft isn't worth interrupting anyone about. */
  if(!words && !d.champ) return "";
  return `<div class="h-resume">
    <b>${esc(words || "Untitled guide")}</b>
    <span>${d.champ ? esc(d.champ) + " · " : ""}unpublished draft in this browser</span>
    <a class="btn btn-sm btn-gold" href="create.html">Pick it up</a>
  </div>`;
}

/* ---------- the page ---------- */

function paint(){
  const all = listPublished();
  const counts = guideCountsByChampion();
  const champsWithGuides = Object.keys(counts).length;
  const roster = (CHAMPIONS || []).length;

  document.getElementById("main").innerHTML = `
  <div class="home-wrap">
    <section class="h-hero">
      ${resumeHtml()}
      <h1>Builds and guides for League of Legends Classic</h1>
      <p>The mode's own champions, items, runes and masteries — not the live game's.
         Write a guide with the real rune page and mastery trees, and share it.</p>
      <div class="h-cta">
        <a class="btn btn-gold" href="create.html">Write a guide</a>
        <a class="btn" href="champions.html">Browse champions</a>
        <span class="h-note">${
          all.length
            ? `${all.length} guide${all.length > 1 ? "s" : ""} across ${champsWithGuides} champion${champsWithGuides > 1 ? "s" : ""} · `
            : roster ? `${roster} champions · ` : ""
        }<span data-patch>${patchLabel()}</span></span>
      </div>
    </section>

    <section class="h-sec" id="guides">${guidesSectionHtml()}</section>

    <section class="h-sec">
      <div class="h-hd">
        <h2>Champions</h2>
        <a class="more" href="champions.html">Every champion →</a>
      </div>
      ${champStripHtml()}
    </section>

    <section class="h-sec">
      <div class="h-hd"><h2>Reference</h2></div>
      <div class="h-tiles">
        <a class="h-tile" href="items.html"><b>Items</b>
          <span>The mode's shop, with Classic's own stats and recipes.</span></a>
        <a class="h-tile" href="runes.html"><b>Runes</b>
          <span>Every mark, seal, glyph and quintessence, checked against the game files.</span></a>
        <!-- There is no masteries reference page; the builder is in the
             creator. This tile used to point at masteries.html, which is a
             redirect — the link worked and the promise didn't. -->
        <a class="h-tile" href="create.html"><b>Masteries</b>
          <span>All three trees and 30 points, in the guide creator.</span></a>
        <a class="h-tile" href="spells.html"><b>Summoner spells</b>
          <span>The sixteen Classic runs, including the ones live League retired.</span></a>
      </div>
    </section>

    <section class="h-sec">
      <div class="h-hd"><h2>What is Classic?</h2></div>
      <div class="h-about">
        <p>League of Legends Classic is Riot's recreation of Season 3 League — old runes,
           old masteries, the old shop — running on the live client.</p>
        <p class="small">S3 Builds reads the mode's own data files, so an item's stats here are
           the ones Classic actually uses rather than the modern game's. Where the mode
           doesn't publish something, the Season 3 archive fills the gap and the page says so.</p>
      </div>
    </section>
  </div>`;

  paintPatch();
}

/* Only the guide section changes when a filter moves, and repainting the
   whole page would take the caret out of the search box mid-word — the same
   bug the item search had in the creator. The caret is put back by hand. */
function repaintGuides(){
  const sec = document.getElementById("guides");
  if(!sec) return paint();
  const box = document.getElementById("hSearch");
  const keep = document.activeElement === box;
  const at = keep ? box.selectionStart : 0;
  sec.innerHTML = guidesSectionHtml();
  if(keep){
    const next = document.getElementById("hSearch");
    if(next){ next.focus(); next.setSelectionRange(at, at); }
  }
}

/* Narrowing the list resets the page size: having asked for everything under
   one filter shouldn't mean a hundred cards under the next. */
function narrow(fn){ fn(); q.limit = HOME_GUIDES; repaintGuides(); }

document.addEventListener("input", e => {
  if(e.target.id === "hSearch") narrow(() => q.text = e.target.value);
});
document.addEventListener("change", e => {
  /* Sort isn't a narrowing — it reorders what you're already looking at. */
  if(e.target.id === "hSort"){ q.sort = e.target.value; repaintGuides(); }
});
document.addEventListener("click", e => {
  const role = e.target.closest("[data-role]");
  if(role) return narrow(() => q.role = role.dataset.role);

  /* Clicking the tag you already have on clears it — one control, both ways. */
  const tag = e.target.closest("[data-tag]");
  if(tag) return narrow(() => q.tag = q.tag === tag.dataset.tag ? "" : tag.dataset.tag);

  if(e.target.closest("[data-clear]"))
    return narrow(() => { q.text = ""; q.role = ""; q.tag = ""; });

  if(e.target.closest("[data-all]")){ q.limit = Infinity; return repaintGuides(); }
});

paint();

/* The guide store, before anything paints. Without this the cache stays
   empty, backendLive() answers false, and every page falls back to this
   browser's localStorage — a site that looks like it works and quietly
   isn't using the database at all. */
loadStore().then(paint).catch(err => console.warn("Guides unavailable:", err.message));

/* The roster arrives over the network; the page is useful before it does
   and simply gets better when it lands. */
loadChampions().then(paint).catch(err => console.warn("Roster unavailable:", err.message));
</script>
</body>
</html>
