<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A community build guide for League of Legends Classic.">
<title>Guide — S3 Builds</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="S3 Builds">
<meta property="og:title" content="Guide — S3 Builds">
<meta property="og:description" content="A community build guide for League of Legends Classic.">
<meta property="og:image" content="https://s3builds.net/logo-512.png">
<meta name="twitter:card" content="summary">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="site.css?v=87">
<style>
  /* This page reads a guide. It never writes one, so there are no fields,
     no pickers and no controls here — only the builders in their finished
     state, which is why the mastery and rune styles can come straight from
     site.css untouched. */

  /* Wider than the reading pages. A guide is a reference you scan as much
     as prose you read, and the narrow measure meant scrolling past the same
     content twice over. The caps that were on the text blocks are gone with
     it — the column governs the line length now. */
  .guide-wrap{max-width:1240px;margin:0 auto;padding:0 20px}

  /* ---------- hero ---------- */
  .g-hero{position:relative;overflow:hidden;border:1px solid var(--line);
    border-radius:var(--radius);background:#2a2418;margin-top:22px}
  .g-splash{position:absolute;inset:0;overflow:hidden}
  .g-splash img{position:absolute;left:0;top:50%;width:100%;
    transform:translateY(calc(-1 * var(--face,22%)));display:block}
  .g-hero::after{content:"";position:absolute;inset:0;
    background:linear-gradient(90deg,rgba(8,11,16,.93) 0%,rgba(8,11,16,.74) 45%,
      rgba(8,11,16,.28) 100%),linear-gradient(0deg,rgba(8,11,16,.92),transparent 62%)}
  /* The hero is 230px tall only when there is splash art to fill it. With
     no art — no champion picked yet, or the fetch hasn't landed — that
     height is just a dark box, and margin:auto on the title parks the gap
     in the middle of it. Without art it collapses to its content. */
  .g-hero-body{position:relative;z-index:1;padding:18px 20px;
    display:flex;flex-direction:column;gap:9px}
  .g-hero.has-art .g-hero-body{min-height:230px}
  /* Only push the title down when there is art under it to push against. */
  .g-hero.has-art .g-title{margin-top:auto}
  .g-hero-top{display:flex;align-items:center;gap:12px}
  .g-face{width:52px;height:52px;border-radius:8px;flex:none;
    border:1px solid rgba(200,163,85,.55);box-shadow:0 2px 10px rgba(0,0,0,.6)}
  .g-who{min-width:0}
  .g-who b{display:block;font-family:var(--font-head);font-size:21px;font-weight:400;
    line-height:1.2;color:#f0e6d2}
  .g-who span{font-size:15px;color:#c8b7a0}
  .g-kit{display:flex;gap:6px;margin-left:14px}
  .g-ab{position:relative;width:38px;height:38px;flex:none;border-radius:4px;
    overflow:hidden;background:#0b0d10;border:1px solid rgba(200,163,85,.5)}
  .g-ab img{width:100%;height:100%;display:block}
  .g-ab i{position:absolute;right:0;bottom:0;z-index:2;font-style:normal;
    min-width:13px;padding:0 2px;border-radius:3px 0 0 0;background:rgba(8,11,16,.82);
    color:var(--c,#c8aa6e);font-family:var(--font-jade);font-size:10px;font-weight:700;
    line-height:13px;text-align:center}
  .g-title{margin:0;font-family:var(--font-head);font-size:34px;font-weight:400;
    line-height:1.2;color:#f0e6d2;text-shadow:0 2px 12px rgba(0,0,0,.8)}
  .g-pitch{margin:0;font-size:16px;color:#d8cdb8;max-width:70ch;
    text-shadow:0 1px 8px rgba(0,0,0,.8)}
  .g-byline{font-size:13.5px;color:#b3a48f}
  /* The row under the byline: the vote button everyone gets, and the edit
     link only the author does — and only on a published guide, since a
     draft preview has nothing to edit back to. */
  .g-acts{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 0}

  /* Sits on the splash, so it carries its own dark plate rather than
     borrowing the page's parchment button. */
  .g-vote{display:inline-flex;align-items:center;gap:8px;padding:6px 14px 6px 11px;
    border-radius:999px;border:1px solid rgba(200,163,85,.5);
    background:rgba(10,13,18,.62);color:#e4d9c2;font-family:var(--font-head);
    font-size:14px;line-height:1;cursor:pointer;transition:.14s}
  .g-vote:hover{background:rgba(20,26,34,.85);border-color:#c8aa6e;color:#f0e6d2}
  .g-vote .arrow{width:0;height:0;border-left:6px solid transparent;
    border-right:6px solid transparent;border-bottom:8px solid currentColor;
    transition:transform .14s}
  .g-vote:hover .arrow{transform:translateY(-1px)}
  .g-vote b{font-weight:400;font-size:16px;font-variant-numeric:tabular-nums}
  .g-vote .word{font-size:13px;color:#b3a48f}
  /* Lit, because you voted. Gold fill rather than a tick, so the state is
     legible at a glance from across the page. */
  .g-vote.on{background:linear-gradient(180deg,#c8aa6e,#a07d3c);border-color:#e6cf9a;
    color:#1a1408}
  .g-vote.on .word{color:#3b2f14}
  .g-vote.on:hover{background:linear-gradient(180deg,#d6bb84,#b08c46)}
  .g-vote[disabled]{opacity:.55;cursor:default}
  .g-vote-err{margin:6px 0 0;font-size:13px;color:#ff9a8a}

  /* ---------- layout ---------- */
  .g-body{display:grid;grid-template-columns:186px minmax(0,1fr);gap:26px;
    align-items:start;padding:16px 0 36px}
  /* A guide short enough to see at once doesn't need a jump list, and an
     empty 186px column beside two paragraphs is worse than no column. */
  .g-body.no-nav{grid-template-columns:minmax(0,1fr)}
  .g-body.no-nav .g-nav{display:none}
  .g-nav{position:sticky;top:76px}
  .g-nav a{display:block;padding:6px 10px;border-radius:var(--radius);
    font-family:var(--font-head);font-size:15.5px;color:var(--muted);
    border:1px solid transparent}
  .g-nav a:hover{color:var(--text);border-color:var(--line);background:hsla(43,47%,60%,.3)}
  .g-nav a.on{background:var(--btn);border-color:hsla(0,0%,100%,.2);color:#f0e6d2}

  /* 12px between sections. The flame heading is a strong enough break on
     its own — and now that it is 30px it is stronger still, so the margin
     that used to do the separating became slack instead. */
  .g-sec{margin-bottom:12px;scroll-margin-top:80px}
  /* No trailing gap above the page padding. */
  .g-sec:last-child{margin-bottom:0}
  .g-sec > h2{margin:0 0 8px;padding:9px 24px;display:inline-block;
    font-family:var(--font-jade);font-size:30px;font-weight:400;color:#600;
    white-space:nowrap;
    background:url("assets/header_flame.png") center/100% 100% no-repeat}

  /* A note the author wrote about that section. */
  .g-note{margin:12px 0 0;padding:14px 16px;border:1px solid var(--line-soft);
    border-radius:var(--radius);background:hsla(43,47%,60%,.18);
    font-size:17.5px;line-height:1.6;color:var(--text)}
  .g-note h4{margin:0 0 7px;font-family:var(--font-head);font-size:17px;
    font-weight:400;color:var(--muted)}
  .g-note p{margin:0 0 8px} .g-note p:last-child{margin-bottom:0}
  .g-note ul,.g-note ol{margin:6px 0;padding-left:22px}
  .g-note blockquote{margin:8px 0;padding:2px 0 2px 12px;
    border-left:2px solid var(--line);color:var(--muted)}
  /* 19px body, 30px section headings. Sized for reading a guide at arm's
     length rather than for fitting the most on screen — this page is the
     product, and the creator's editor is set to 15px so what you type is
     still a little smaller than what a reader gets.

     No character cap: the request was for less scrolling, and a capped
     measure inside a wide column produced exactly that complaint. If lines
     ever feel too long to track, the fix is a cap here rather than a
     narrower page. */
  .g-prose{font-size:19px;line-height:1.65;color:var(--text)}
  .g-prose h3{margin:0 0 10px;font-family:var(--font-head);font-size:23px;
    font-weight:400;color:var(--title)}
  .g-prose > div + h3{margin-top:20px}
  .g-prose p{margin:0 0 12px}
  .g-prose p:last-child{margin-bottom:0}
  .g-prose ul,.g-prose ol{margin:10px 0;padding-left:24px}
  .g-prose li{margin:4px 0}

  /* ---------- reader tabs ---------- */
  .g-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
  .g-tabs button{padding:6px 15px;border-radius:2px;font-family:var(--font-jade);
    font-size:14.5px;color:#f0e6d2;border:1px solid hsla(0,0%,100%,.14);
    background:linear-gradient(180deg,#4276bc,#1e3656)}
  .g-tabs button.on{background:#1e3656}
  .g-tabs button:hover:not(.on){filter:brightness(1.15)}

  /* ---------- item build ---------- */
  .g-line{margin-bottom:14px}
  .g-line:last-child{margin-bottom:0}
  .g-line-hd{display:flex;align-items:baseline;gap:10px;margin-bottom:7px;
    padding-bottom:5px;border-bottom:1px solid var(--line-soft)}
  .g-line-hd h3{margin:0;font-family:var(--font-head);font-size:21px;
    font-weight:400;color:var(--title)}
  .g-line-hd .gold{margin-left:auto;font-size:15px;color:var(--gold-hi);
    font-variant-numeric:tabular-nums}
  .g-items{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .g-item{position:relative;width:48px;height:48px;border-radius:var(--radius);
    border:1px solid rgba(201,162,60,.55);background:var(--bg-2);flex:none;
    transition:.13s}
  .g-item:hover{border-color:var(--gold);transform:translateY(-2px)}
  .g-item img{width:100%;height:100%;border-radius:4px;object-fit:cover;display:block}
  .g-item .ord{position:absolute;bottom:-3px;left:-3px;background:var(--bg);
    color:var(--muted);font-size:9px;font-weight:800;border:1px solid var(--line);
    border-radius:4px;padding:0 3px;line-height:13px}
  .g-arrow{color:var(--muted-2);font-size:13px}
  /* What the author said about this line specifically, as opposed to the
     note on the item build as a whole. */
  .g-line-note{margin:9px 0 0;padding-left:12px;border-left:2px solid var(--line-soft);
    font-size:17px;line-height:1.6;color:var(--text)}
  .g-line-note p{margin:0 0 7px} .g-line-note p:last-child{margin-bottom:0}
  .g-line-note ul,.g-line-note ol{margin:5px 0;padding-left:22px}

  /* ---------- spells ---------- */
  .g-spells{display:flex;gap:10px;flex-wrap:wrap}
  .g-spell{display:flex;align-items:center;gap:9px;padding:6px 12px 6px 6px;
    border:1px solid var(--line);border-radius:8px;background:var(--bg-2)}
  .g-spell img{width:44px;height:44px;border-radius:6px;border:1px solid var(--line);
    display:block}
  .g-spell b{font-size:15.5px;font-weight:600;color:var(--text)}

  /* The priority, above the grid. */
  .g-maxorder{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .g-maxorder .lbl{font-family:var(--font-head);font-size:14.5px;text-transform:uppercase;
    letter-spacing:.07em;color:var(--muted)}
  .g-maxorder .sep{color:var(--muted-2);font-size:15px}
  .g-maxorder .tail{font-size:12px;color:var(--muted-2);margin-left:4px}
  .g-maxorder .g-ab.part{opacity:.45}

  /* ---------- skill order ---------- */
  .g-skill{border:1px solid hsla(40,45%,61%,.3);overflow:hidden;background:#f0e4b1}
  .g-skill table{width:max-content;margin:0 auto;border-collapse:collapse;
    font-family:var(--font-jade);table-layout:fixed}
  .g-skill th{font-weight:400;padding:0;text-align:center;color:#7d5444}
  .g-skill tr:first-child th{font-size:11px;padding:6px 0}
  .g-skill td{width:30px;padding:2px;text-align:center}
  .g-skill tr + tr{border-top:1px solid #cdbd7b}
  .g-skill th.k{display:flex;align-items:center;gap:9px;height:44px;width:190px;
    text-align:left;padding:6px 10px 6px 4px}
  .g-skill .name{flex:1;font-size:14px;color:#000;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;min-width:0}
  .g-skill .key{width:20px;height:20px;flex:none;border-radius:2px;display:grid;
    place-items:center;background:var(--c);border:1px solid rgba(240,230,210,.25);
    color:var(--ink,#010a13);font-size:11px;font-weight:700}
  .g-skill .cell{position:relative;display:block;width:26px;height:26px;margin:0 auto;
    border-radius:2px;background:#e8dec1;border:1px solid rgba(201,162,60,.5);
    overflow:hidden}
  .g-skill .cell.on{border-color:var(--c);box-shadow:0 0 6px color-mix(in srgb,var(--c) 45%,transparent)}
  .g-skill .cell img{width:100%;height:100%;display:block}
  .g-skill .cell i{position:absolute;inset:0;display:grid;place-items:center;
    font-style:normal;font-size:11px;font-weight:700;color:#f0e6d2;
    text-shadow:0 1px 3px #000}
  .g-skill .used{padding:0 10px;font-size:12px;color:#7d5444;width:44px}

  /* ---------- runes / masteries ---------- */
  .g-plate{max-width:1060px;margin:0;padding:16px;border-radius:8px;
    border:1px solid #b09853;
    box-shadow:inset 0 1px 0 rgba(255,248,228,.45),0 2px 10px rgba(90,66,40,.18);
    background:url("assets/parchment-panel.png") center/114% 114% no-repeat,#d9c9a3}
  /* Page left, stats right — the way the client lays its rune screen out,
     and it lets the parchment take the width it was stacked out of. The
     stats column is fixed so the page gets everything that's left. */
  .g-runes{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:18px;
    align-items:start}
  .g-rune-page{position:relative;overflow:hidden;aspect-ratio:1.735;
    min-width:0;margin:0}
  .g-stats{margin:0;border:1px solid #b09853;border-radius:6px;
    background:hsla(43,47%,60%,.15);padding:10px 14px;
    font-family:var(--font-jade);font-size:15px;color:#1e2328}
  .g-stats .hd{margin:0 0 6px;padding-bottom:6px;border-bottom:1px solid #b09853;
    font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:#7d5444}
  .g-stats .row{display:flex;justify-content:space-between;gap:12px;padding:3px 0}
  .g-stats .row b{font-variant-numeric:tabular-nums}
  /* Under about 900px the two columns would both be too narrow to read, so
     the stats go back under the page. */
  @media(max-width:900px){ .g-runes{grid-template-columns:minmax(0,1fr)} }
  .g-mast-totals{display:flex;gap:18px;justify-content:center;margin-bottom:12px;
    font-family:var(--font-jade)}
  .g-mast-totals span{display:flex;align-items:center;gap:6px;font-size:18px;color:#1e2328}
  .g-mast-totals img{width:28px;height:auto}

  .g-empty{color:var(--muted-2);font-size:13.5px;font-style:italic}

  /* Reference chips, same as the editor draws them. */
  .ref{display:inline;padding:0 3px;border-radius:3px;color:#2c66aa;font-weight:600;
    white-space:nowrap;background:rgba(44,102,170,.09);cursor:help}
  .ref:hover{background:rgba(44,102,170,.18)}
  .ref.pending{background:rgba(44,102,170,.05);color:#4a7cbb}
  .ref-ico{width:16px;height:16px;border-radius:2px;display:inline-block;
    vertical-align:-0.25em;margin-right:4px}

  .g-msg{max-width:560px;margin:60px auto;text-align:center;color:var(--muted)}
  .g-msg h2{font-family:var(--font-head);color:var(--title);font-size:22px;margin:0 0 8px}

  /* ---------- the published list ---------- */
  .g-list{max-width:760px;margin:30px auto 70px}
  .g-list h1{margin:0 0 4px;font-family:var(--font-head);font-size:26px;color:var(--title)}
  .g-list .hint{margin:0 0 18px;color:var(--muted);font-size:13.5px}
  .g-row{display:flex;align-items:center;gap:12px;padding:11px 13px;margin-bottom:8px;
    border:1px solid var(--line);border-radius:var(--radius);background:hsla(43,47%,60%,.22)}
  .g-row .meta{min-width:0;flex:1}
  .g-row b{display:block;font-family:var(--font-head);font-size:16px;font-weight:400;
    color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .g-row span{font-size:12.5px;color:var(--muted)}
  /* Between the title and the buttons, so the numbers line up down the
     list rather than sitting at a different x on every row. */
  .g-row .g-tally{flex:none;display:inline-flex;align-items:center;gap:4px;
    width:44px;justify-content:flex-end;color:var(--gold-hi)}
  .g-row .g-tally .arrow{width:0;height:0;border-left:4.5px solid transparent;
    border-right:4.5px solid transparent;border-bottom:6px solid currentColor}
  .g-row .g-tally b{display:inline;font-family:var(--font-head);font-size:15px;
    font-weight:400;font-variant-numeric:tabular-nums;color:inherit}
  .g-row .g-tally.none{color:var(--muted-2);opacity:.55}
  .g-row .drop{background:none;border:0;color:var(--muted-2);font-size:12px;font-weight:600;
    padding:4px 8px;border-radius:6px}
  .g-row .drop:hover{background:var(--panel-2);color:var(--red)}

  @media(max-width:900px){
    .g-body{grid-template-columns:1fr}
    .g-nav{position:static;display:flex;gap:4px;flex-wrap:wrap}
  }
</style>
</head>
<body>
<div id="main"></div>

<script src="site.js"></script>
<script src="data-rune-icons.js"></script>
<script src="data-runes.js"></script>
<script src="data-champ-focus.js"></script>
<script src="data-mastery-tree.js"></script>
<script src="data-masteries.js"></script>
<script src="guide-sanitise.js"></script>
<script src="config.js"></script>
<script src="guide-store.js"></script>
<script src="guide-load.js"></script>
<script>
renderChrome("");

/* ============================================================
   RENDER

   Everything below takes a guide object and returns markup. None of it
   knows where the guide came from — that is guide-load.js's business —
   so the same functions will serve a hosted guide the day there is one.
   ============================================================ */

let G = null;                 /* the guide being shown */
let ABILITIES_DOC = null;     /* its champion's kit, once fetched */
const view = {setup: 0, skills: 0, spells: 0};   /* which tab of each */

const KEYS = [{k:"Q",color:"#4d74a4",ink:"#010a13"},{k:"W",color:"#0ac8b9",ink:"#010a13"},
              {k:"E",color:"#c89b3c",ink:"#010a13"},{k:"R",color:"#c73e00",ink:"#f0e6d2"}];

/* ---------- small shared bits ---------- */

const abilityOf = k => ABILITIES_DOC
  ? (ABILITIES_DOC.spells || []).find(s => s.letter === k) || null : null;

function tabs(name, pages, current){
  if(pages.length < 2) return "";
  return `<div class="g-tabs">${pages.map((p, i) =>
    `<button type="button" class="${i === current ? "on" : ""}"
      data-tab="${name}" data-i="${i}">${esc(p.name)}</button>`).join("")}</div>`;
}

/* An author's note, if they wrote one for this section. */
function note(key, label){
  const html = G.notes[key];
  if(!html || !String(html).trim()) return "";
  return `<div class="g-note"><h4>${esc(label)}</h4>${html}</div>`;
}

/* ---------- hero ---------- */

function heroHtml(){
  const c = G.champ && (CHAMPIONS || []).find(x => x.name === G.champ);
  const splash = ABILITIES_DOC && ABILITIES_DOC.splash;
  const faceY = c && typeof champFaceY === "function"
    ? champFaceY(CLASSIC.champId(c.key)) : 22;
  const doc = ABILITIES_DOC;

  const kit = !doc ? "" : [
    doc.passive ? {letter:"P", name:doc.passive.name, icon:doc.passive.icon, color:"#8e9bb0"} : null,
    ...KEYS.map(a => {
      const sp = (doc.spells || []).find(x => x.letter === a.k);
      return sp ? {letter:a.k, name:sp.name, icon:sp.icon, color:a.color} : null;
    })
  ].filter(Boolean).map(a =>
    `<span class="g-ab" data-tip-ab="${a.letter}" style="--c:${a.color}" title="${esc(a.name)}">
       ${a.icon ? `<img src="${esc(a.icon)}" alt="" onerror="this.remove()">` : ""}
       <i>${a.letter}</i></span>`).join("");

  const tag = G.tag && (typeof TAGS !== "undefined" ? TAGS.find(t => t.k === G.tag) : null);

  return `<div class="guide-wrap"><div class="g-hero ${splash ? "has-art" : ""}">
    <div class="g-splash">${splash
      ? `<img src="${esc(splash)}" alt="" style="--face:${faceY}%" onerror="this.remove()">` : ""}</div>
    <div class="g-hero-body">
      <div class="g-hero-top">
        ${c ? art({s3: DD.champImg(c.id), classic: CLASSIC.champIcon(c.key, c.name),
                   alt: c.name, cls: "g-face"}) : ""}
        <div class="g-who">
          <b>${esc(G.champ || "No champion")}</b>
          <span>${esc(c ? c.cls : "")}${c ? " · " : ""}${esc(G.role)}</span>
        </div>
        <div class="g-kit">${kit}</div>
      </div>
      <h1 class="g-title">${esc(G.title || "Untitled guide")}
        ${tag ? `<span class="tag ${tag.k}">${tag.label}</span>` : ""}</h1>
      ${G.blurb ? `<p class="g-pitch">${esc(G.blurb)}</p>` : ""}
      <p class="g-byline">${G.author ? "by " + esc(G.author) + " · " : ""}<span data-patch>${patchLabel()}</span></p>
      <div class="g-acts">
        ${voteBtnHtml()}
        ${G.slug && G.mine ? `<a class="btn btn-sm"
          href="create.html?edit=${encodeURIComponent(G.slug)}">Edit this guide</a>` : ""}
      </div>
    </div>
  </div></div>`;
}

/* ---------- upvotes ----------
   Only a guide that is actually published can be voted on. A draft preview
   and a guide opened from a shared link both render identically to this
   page, but neither has a record in the store to hold a tally — offering a
   button that quietly did nothing would be worse than not offering one. */
function voteBtnHtml(){
  if(G.source !== "store" || !G.slug) return "";
  const on = hasVoted(G.slug);
  const n  = voteCount(G.slug);
  return `<button type="button" class="g-vote${on ? " on" : ""}" data-vote
      aria-pressed="${on}"
      title="${on ? "Remove your upvote" : "Upvote this guide"}">
    <span class="arrow" aria-hidden="true"></span>
    <b>${n}</b>
    <span class="word">${n === 1 ? "upvote" : "upvotes"}</span>
  </button>`;
}

document.addEventListener("click", async e => {
  const btn = e.target.closest("[data-vote]");
  if(!btn) return;

  /* Replace just the button. Repainting the page would rebuild the hero,
     scroll position and all, for a two-character change — and would lose
     the section the reader is on.

     The button is disabled while the vote is in flight. Without it, an
     impatient double-click sends two requests, and the second one undoes
     the first — the tally lands back where it started and the reader is
     left wondering whether the site works. */
  try{
    btn.disabled = true;
    await toggleVote(G.slug);
    btn.outerHTML = voteBtnHtml();
  }catch(err){
    btn.disabled = false;
    const note = document.createElement("p");
    note.className = "g-vote-err";
    note.textContent = err.message;
    const row = btn.closest(".g-acts");
    if(row && !row.parentElement.querySelector(".g-vote-err"))
      row.insertAdjacentElement("afterend", note);
  }
});

/* ---------- sections ---------- */

function introHtml(){
  if(!G.sections.length) return "";
  return `<section class="g-sec" id="intro">
    <h2>Introduction</h2>
    <div class="g-prose">${G.sections.map(s =>
      `${s.h ? `<h3>${esc(s.h)}</h3>` : ""}<div>${s.b}</div>`).join("")}</div>
  </section>`;
}

function itemsHtml(){
  if(!G.items.length) return "";
  const line = r => {
    const total = r.items.reduce((n, id) => n + ((ITEM_BY_ID.get(String(id)) || {}).total || 0), 0);
    const chips = r.items.map((id, i) => {
      const it = ITEM_BY_ID.get(String(id));
      /* An arrow between ordered items reads as a path rather than a set. */
      const arrow = r.ordered && i ? `<span class="g-arrow">›</span>` : "";
      return `${arrow}<span class="g-item" data-tip-item="${esc(id)}"
        title="${esc(it ? it.name : id)}">
        ${it ? art({s3: it.icon, classic: it.icon, alt: it.name}) : ""}
        ${r.ordered ? `<span class="ord">${i + 1}</span>` : ""}</span>`;
    }).join("");
    return `<div class="g-line">
      <div class="g-line-hd"><h3>${esc(r.label)}</h3>
        ${total ? `<span class="gold">${total.toLocaleString()}g</span>` : ""}</div>
      <div class="g-items">${chips}</div>
      ${r.note && r.note.trim() ? `<div class="g-line-note">${r.note}</div>` : ""}
    </div>`;
  };
  return `<section class="g-sec" id="items">
    <h2>Item build</h2>
    ${G.items.map(line).join("")}
    ${note("items", "Why this build path")}
  </section>`;
}

function spellsHtml(){
  const sets = G.spellSets.filter(s => s.length);
  if(!sets.length) return "";
  const set = sets[Math.min(view.spells, sets.length - 1)];
  const named = sets.map((s, i) => ({name: i === 0 ? "Main" : "Alternative"}));
  const one = name => {
    const sp = (SPELLS || []).find(x => x.name === name);
    return `<div class="g-spell" data-tip-spell="${esc(name)}">
      ${sp ? spellArt(sp) : ""}<b>${esc(name)}</b></div>`;
  };
  return `<section class="g-sec" id="spells">
    <h2>Summoner spells</h2>
    ${tabs("spells", named, view.spells)}
    <div class="g-spells">${set.map(one).join("")}</div>
    ${note("spells", "Why these summoners")}
  </section>`;
}

/* Which ability is maxed first, second, third — read off the order rather
   than stated separately, so it cannot disagree with the grid. An ability
   counts as maxed at the level it reaches its cap; anything never maxed
   comes after those that are, ranked by how many points it got. */
function maxOrderOf(skills){
  const cap = k => (k === "R" ? 3 : 5);
  return KEYS.map(a => {
    let count = 0, maxedAt = Infinity;
    skills.forEach((k, i) => {
      if(k !== a.k) return;
      count++;
      if(count === cap(a.k) && maxedAt === Infinity) maxedAt = i + 1;
    });
    return {...a, count, maxedAt};
  }).filter(x => x.count)
    .sort((x, y) => x.maxedAt - y.maxedAt || y.count - x.count);
}

function skillsHtml(){
  const page = G.skillPages[Math.min(view.skills, G.skillPages.length - 1)];
  if(!page.skills.filter(Boolean).length) return "";

  const head = `<tr><th class="k"><span style="font-size:11px;letter-spacing:.1em;
    text-transform:uppercase;color:#7d5444">Level</span></th>`
    + Array.from({length: 18}, (_, i) => `<th>${i + 1}</th>`).join("") + `<th></th></tr>`;

  const rows = KEYS.map(a => {
    const sp = abilityOf(a.k);
    const cells = Array.from({length: 18}, (_, i) => {
      const on = page.skills[i] === a.k;
      const rank = on ? page.skills.slice(0, i + 1).filter(x => x === a.k).length : 0;
      return `<td><span class="cell ${on ? "on" : ""}" style="--c:${a.color}">
        ${on && sp && sp.icon ? `<img src="${esc(sp.icon)}" alt="">` : ""}
        ${on ? `<i>${rank}</i>` : ""}</span></td>`;
    }).join("");
    const used = page.skills.filter(x => x === a.k).length;
    return `<tr><th class="k">
        <span class="key" style="--c:${a.color};--ink:${a.ink}">${a.k}</span>
        <span class="name">${esc(sp ? sp.name : "")}</span>
      </th>${cells}<th class="used">${used}/${a.k === "R" ? 3 : 5}</th></tr>`;
  }).join("");

  const order = maxOrderOf(page.skills);
  const chain = !order.length ? "" : `<div class="g-maxorder">
    <span class="lbl">Max order</span>
    ${order.map((a, i) => {
      const sp = abilityOf(a.k), full = a.count >= (a.k === "R" ? 3 : 5);
      return `${i ? `<span class="sep">›</span>` : ""}
        <span class="g-ab ${full ? "" : "part"}" data-tip-ab="${a.k}"
          style="--c:${a.color}" title="${esc(sp ? sp.name : a.k)}">
          ${sp && sp.icon ? `<img src="${esc(sp.icon)}" alt="">` : ""}
          <i>${a.k}</i></span>`;
    }).join("")}
    ${order.some(a => a.count < (a.k === "R" ? 3 : 5))
      ? `<span class="tail">faded = not maxed</span>` : ""}
  </div>`;

  return `<section class="g-sec" id="skills">
    <h2>Skill order</h2>
    ${tabs("skills", G.skillPages, view.skills)}
    ${chain}
    <div class="g-skill"><table>${head}${rows}</table></div>
    ${note("skills", "Why this skill order")}
  </section>`;
}

function runesHtml(){
  const setup = G.setups[Math.min(view.setup, G.setups.length - 1)];
  const filled = RUNE_SLOTS.reduce((n, s) => n + setup.runes[s.key].filter(Boolean).length, 0);
  if(!filled) return "";

  let sockets = "";
  for(const s of RUNE_SLOTS){
    const pos = RUNE_SLOT_POS[s.key] || [];
    setup.runes[s.key].forEach((id, i) => {
      const [x, y] = pos[i] || [50, 50];
      const r = id ? CLASSIC_RUNES.find(x2 => x2.id === id) : null;
      sockets += `<span class="rune-slot ${s.key === "quint" ? "big" : "small"} ${r ? "has" : ""}
        ${r ? "glow-" + r.group : ""}" style="left:${x}%;top:${y}%"
        title="${esc(r ? r.name : s.name + " socket")}">
        <img class="sock" src="${runeSlotArt(s.key)}" alt="">
        ${r && runeArtUrl(r) ? `<img class="filled" src="${runeArtUrl(r)}" alt="">` : ""}
      </span>`;
    });
  }

  /* What the page actually gives you, totalled by stat — the number a
     reader wants and the creator shows in its statistics box. */
  const totals = {};
  for(const s of RUNE_SLOTS)
    for(const id of setup.runes[s.key]){
      if(!id) continue;
      const r = CLASSIC_RUNES.find(x => x.id === id);
      if(!r) continue;
      const key = (r.nameStat || r.stat) + (r.scaling ? " per level" : "");
      totals[key] = (totals[key] || 0) + (r.scaling ? r.perLevel : r.value);
    }
  const stats = Object.entries(totals).map(([k, v]) =>
    `<div class="row"><span>${esc(k)}</span><b>+${Math.round(v * 1000) / 1000}</b></div>`).join("");

  return `<section class="g-sec" id="runes">
    <h2>Runes</h2>
    ${tabs("setup", G.setups, view.setup)}
    <div class="g-plate">
      <div class="g-runes">
        <div class="g-rune-page rune-page"><div class="rune-crop"><div class="rune-sockets">${sockets}</div></div></div>
        <div class="g-stats">
          <div class="hd">Statistics</div>
          ${stats || "<div class='row'>No runes placed.</div>"}
        </div>
      </div>
    </div>
    ${note("runes", "Why this rune page")}
  </section>`;
}

function masteriesHtml(){
  const setup = G.setups[Math.min(view.setup, G.setups.length - 1)];
  const alloc = setup.mast || {};
  if(!MASTERY_TREE || !Object.keys(alloc).length) return "";

  const totals = MASTERY_TREES.map(t => treePoints(alloc, t.key));
  const panels = MASTERY_TREES.map((t, ti) => {
    const rows = (MASTERY_TREE[t.key] || []).map(row =>
      `<div class="mast-row">${Array.from({length: MASTERY_COLS}, (_, c) => {
        const cell = row[c];
        if(!cell) return `<div class="mast-cell"></div>`;
        const id = cell.masteryId, pts = alloc[id] || 0, max = masteryRanks(id);
        return `<div class="mast-cell">
          <span class="mast ${pts ? "on" : "off"} ${pts >= max ? "max" : ""}"
            title="${esc(masteryName(id))} ${pts} / ${max}">
            <img src="${masteryImg(id, pts > 0)}" alt="" loading="lazy">
            <span class="pts">${pts} / ${max}</span></span></div>`;
      }).join("")}</div>`).join("");
    return `<div class="mast-tree">
      <div class="mast-rows">${rows}</div>
      <div class="mast-tree-foot">
        <img src="assets/mastery-icons/mastery_icon_${t.key.toLowerCase()}.png" alt="">
        <span>${esc(t.name.toUpperCase())}:</span><b>${totals[ti]}</b></div>
    </div>`;
  }).join("");

  return `<section class="g-sec" id="masteries">
    <h2>Masteries</h2>
    ${tabs("setup", G.setups, view.setup)}
    <div class="g-mast-totals">${MASTERY_TREES.map((t, i) =>
      `<span><img src="assets/mastery-icons/mastery_icon_${t.key.toLowerCase()}.png" alt="">
        ${totals[i]}</span>`).join("")}</div>
    <div class="g-plate"><div class="mast-panels">${panels}</div></div>
    ${note("mast", "Why these masteries")}
  </section>`;
}

/* ---------- tooltips ----------
   The same black panel the creator uses, on everything a reader would
   want to hover: an item in a build line, an ability on the hero, a
   summoner spell, and any reference chip in the prose. Chips were inert
   here, which made them look like decoration rather than information.

   The panel, its placement and the hover wiring now live in site.js —
   this page was the first to need them, the items page is the third, and
   three copies is two too many. What stays here is what only this page
   can answer: which ability, which spell, which reference chip. */

const numsRow = rows => {
  const kept = rows.filter(r => r[1]);
  return kept.length ? `<div class="tip-nums">${kept.map(([l, v]) =>
    `<span>${l} <b>${esc(v)}</b></span>`).join("")}</div>` : "";
};

function abilityTipHtml(letter){
  const doc = ABILITIES_DOC; if(!doc) return "";
  const passive = letter === "P";
  const sp = passive ? doc.passive : (doc.spells || []).find(x => x.letter === letter);
  if(!sp) return "";
  return `<div class="tip-hd">
      ${sp.icon ? `<img src="${esc(sp.icon)}" alt="">` : ""}
      <h4>${esc(sp.name)}</h4>
      <span class="rank">${passive ? "Passive" : letter}</span>
    </div>
    <p class="tip-body">${esc(sp.desc || "")}</p>
    ${passive ? "" : numsRow([["Cooldown", sp.cooldown ? sp.cooldown + "s" : null],
                              ["Cost", sp.cost], ["Range", sp.range]])}`;
}

function spellTipHtml(name){
  const sp = (SPELLS || []).find(x => x.name === name);
  if(!sp) return "";
  return `<div class="tip-hd">${spellArt(sp, {cls: "", alt: ""})}<h4>${esc(sp.name)}</h4></div>
    <p class="tip-body">${esc(sp.description || "")}</p>
    ${numsRow([["Cooldown", sp.cooldown ? sp.cooldown + "s" : null], ["Range", sp.range]])}`;
}

/* A reference chip in the prose. Its token already says what it is, so
   this is a lookup rather than a second catalogue. */
function refTipHtml(token){
  const m = /^([a-z]+):(.+)$/.exec(String(token || ""));
  if(!m) return "";
  const [, kind, id] = m;
  if(kind === "item")    return itemTipHtml(id);
  if(kind === "spell")   return spellTipHtml((SPELLS.find(s => s.id === id) || {}).name);
  if(kind === "ability") return abilityTipHtml(id.slice(id.lastIndexOf("-") + 1));
  if(kind === "rune"){
    const r = (typeof CLASSIC_RUNES !== "undefined" ? CLASSIC_RUNES : []).find(x => x.id === id);
    return r ? `<div class="tip-hd"><h4>${esc(r.name)}</h4></div>
      <p class="tip-body">${esc(runeEffect(r))}</p>` : "";
  }
  if(kind === "mastery"){
    const mm = (MASTERY_BY_ID || {})[id];
    return mm ? `<div class="tip-hd">
        <img src="${masteryImg(id, true)}" alt=""><h4>${esc(mm.name)}</h4>
        <span class="rank">${mm.ranks} rank${mm.ranks > 1 ? "s" : ""}</span></div>
      <p class="tip-body">${esc(mm.description || "")}</p>` : "";
  }
  if(kind === "champ"){
    const c = (CHAMPIONS || []).find(x => x.id === id);
    return c ? `<div class="tip-hd">
      ${champImgTag(c, "")}<h4>${esc(c.name)}</h4>
      <span class="rank">${esc(c.cls)}</span></div>` : "";
  }
  return "";
}

/* Items are already registered by site.js. These three are the ones only
   this page can answer, and they go through the same listener, so the
   panel is never being shown by one handler and hidden by another. */
registerTip("[data-tip-ab]",    "ab",    el => abilityTipHtml(el.dataset.tipAb));
registerTip("[data-tip-spell]", "spell", el => spellTipHtml(el.dataset.tipSpell));
registerTip(".ref[data-ref]",   "ref",   el => refTipHtml(el.getAttribute("data-ref")));

/* ---------- the page ---------- */

function paint(){
  const parts = [
    ["intro",     "Introduction",     introHtml()],
    ["items",     "Item build",       itemsHtml()],
    ["spells",    "Summoner spells",  spellsHtml()],
    ["skills",    "Skill order",      skillsHtml()],
    ["runes",     "Runes",            runesHtml()],
    ["masteries", "Masteries",        masteriesHtml()]
  ].filter(p => p[2]);

  document.getElementById("main").innerHTML = heroHtml() + `
    <div class="guide-wrap"><div class="g-body ${parts.length < 3 ? "no-nav" : ""}">
      <nav class="g-nav">${parts.map(([id, label]) =>
        `<a href="#${id}">${label}</a>`).join("")}</nav>
      <main>${parts.map(p => p[2]).join("")
        || `<p class="g-empty">This guide is still empty.</p>`}</main>
    </div></div>`;

  /* The nav is rebuilt on every paint, so the observer has to be too. */
  watchSections();
  paintPatch();      /* the byline is redrawn with everything else */
}

/* ---- which section you are reading ----
   The nav has always had an .on style and nothing ever set it. An observer
   is better than a scroll handler here: the browser does the work, and it
   reports the sections actually on screen rather than making us measure
   every one of them on every frame.

   The rule is "topmost section currently in view". A guide's sections are
   tall enough that several are visible at once, so picking the highest one
   matches what someone would say they are reading. */
let spy = null;
function watchSections(){
  if(spy) spy.disconnect();
  const links = [...document.querySelectorAll(".g-nav a")];
  const sections = [...document.querySelectorAll(".g-sec")];
  if(!links.length || !sections.length || typeof IntersectionObserver === "undefined") return;

  const visible = new Set();
  const mark = () => {
    if(!visible.size) return;
    /* Document order, so "topmost" is just the first one still in view. */
    const top = sections.find(sec => visible.has(sec));
    for(const a of links)
      a.classList.toggle("on", !!top && a.getAttribute("href") === "#" + top.id);
  };
  spy = new IntersectionObserver(entries => {
    for(const e of entries){
      if(e.isIntersecting) visible.add(e.target); else visible.delete(e.target);
    }
    mark();
  }, {rootMargin: "-80px 0px -55% 0px"});   /* below the sticky header, top half only */
  sections.forEach(sec => spy.observe(sec));
}

/* Tabs are the one thing a reader can change, and they only change which
   page is shown — nothing is written anywhere. */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-tab]");
  if(!b) return;
  view[b.dataset.tab] = +b.dataset.i;
  paint();
});

/* Everything published in this browser. Stands in for the index page a
   hosted site would have, and is how you find a guide again after
   publishing it. */
function paintList(){
  const me = currentUser();
  const rows = listPublished({mine: true});
  document.getElementById("main").innerHTML = `<div class="guide-wrap g-list">
    <h1>${me ? "My guides" : "Published guides"}</h1>
    <p class="hint">${rows.length
      ? (me ? `Published by ${esc(me.name)}. ` : "")
        + "Stored in this browser — a hosted site would keep them on your account."
      : "Nothing published yet."}</p>
    ${rows.map(r => `<div class="g-row">
      <div class="meta">
        <b>${esc(r.title)}</b>
        <span>${esc(r.champ || "No champion")}${r.role ? " · " + esc(r.role) : ""}
          · ${new Date(r.at).toLocaleDateString()}${
            r.updated ? " · edited " + new Date(r.updated).toLocaleDateString() : ""}</span>
      </div>
      <!-- Your own guides are the one place a tally is worth reading at a
           glance: otherwise the only way to see what a guide earned was to
           open it, one at a time. -->
      <span class="g-tally${r.votes ? "" : " none"}"
        title="${r.votes === 1 ? "1 upvote" : (r.votes || 0) + " upvotes"}">
        <span class="arrow" aria-hidden="true"></span><b>${r.votes || 0}</b>
      </span>
      <a class="btn btn-sm" href="guide.html?g=${encodeURIComponent(r.slug)}">Open</a>
      <a class="btn btn-sm btn-ghost"
         href="create.html?edit=${encodeURIComponent(r.slug)}">Edit</a>
      <button type="button" class="drop" data-drop="${esc(r.slug)}">Remove</button>
    </div>`).join("")}
    <p style="margin-top:18px"><a class="btn btn-gold" href="create.html">Write a guide</a></p>
  </div>`;
}

document.addEventListener("click", async e => {
  const drop = e.target.closest("[data-drop]");
  if(!drop) return;
  drop.disabled = true;
  try{ await unpublishGuide(drop.dataset.drop); }
  catch(err){ drop.disabled = false; alert(err.message); return; }
  paintList();
});

/* ---------- boot ---------- */

(async function(){
  const main = document.getElementById("main");

  /* The guide store, before anything paints. Without this the cache stays
   empty, backendLive() answers false, and every page falls back to this
   browser's localStorage — a site that looks like it works and quietly
   isn't using the database at all. */
  await loadStore();
  paintAccount();

  /* ?list=1 is the index rather than a guide. */
  if(new URLSearchParams(location.search).get("list")){ paintList(); return; }

  main.innerHTML = `<div class="g-msg"><h2>Loading…</h2></div>`;

  try{
    G = await loadGuide();
  }catch(err){
    const published = listPublished().length;
    main.innerHTML = `<div class="g-msg">
      <h2>Nothing to show</h2>
      <p>${esc(err.message)}</p>
      <p><a class="btn" href="create.html">Write a guide</a>
      ${published ? ` <a class="btn btn-gold" href="guide.html?list=1">See ${published} published</a>` : ""}</p>
      </div>`;
    return;
  }

  document.title = (G.title || "Guide") + " — S3 Builds";
  paint();

  /* The catalogues arrive after the first paint. Each repaints on its own,
     so a slow one never blocks the rest of the page. */
  const jobs = [
    loadChampions().then(paint).catch(() => {}),
    loadItemIndex().then(paint).catch(() => {}),
    loadSpells().then(paint).catch(() => {}),
    loadMasteries().then(paint).catch(() => {}),
    loadRuneArt().then(paint).catch(() => {})
  ];
  if(G.champ){
    jobs.push(loadChampions()
      .then(() => {
        const c = (CHAMPIONS || []).find(x => x.name === G.champ);
        return c ? loadChampSpells(c) : null;
      })
      .then(doc => { ABILITIES_DOC = doc; paint(); })
      .catch(() => {}));
  }
  await Promise.allSettled(jobs);
})();
</script>
</body>
