<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Summoner Spells — S3 Builds</title>
<meta name="description" content="Every League Classic summoner spell, including the ones retired from live League.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="S3 Builds">
<meta property="og:title" content="Summoner Spells — S3 Builds">
<meta property="og:description" content="Every summoner spell in League of Legends Classic, including the ones live League retired.">
<meta property="og:image" content="https://s3builds.net/logo-512.png">
<meta name="twitter:card" content="summary">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="site.css?v=95">
<style>
  .spell-layout{display:grid;grid-template-columns:1fr 420px;gap:26px;align-items:start;padding-bottom:60px}
  .spell-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:14px}
  .spell-tile{display:flex;flex-direction:column;align-items:center;gap:7px;transition:.15s;
    background:none;border:0;padding:0;font-family:inherit}
  .spell-tile:hover{transform:translateY(-3px)}
  .spell-tile img{width:100%;aspect-ratio:1;border-radius:9px;border:1px solid var(--line);
    background:var(--panel-2);object-fit:cover;display:block}
  .spell-tile:hover img{border-color:var(--gold)}
  .spell-tile.on img{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
  .spell-tile b{font-size:12.5px;font-weight:600;color:var(--muted);text-align:center}
  .spell-tile.on b,.spell-tile:hover b{color:var(--text)}
  .spell-tile small{font-size:10px;color:var(--muted-2)}

  .spell-detail{position:sticky;top:76px}
  .sd-head{display:flex;gap:14px;align-items:flex-start;margin-bottom:14px}
  .sd-head img{width:72px;height:72px;border-radius:11px;border:1px solid var(--line);flex:none}
  .sd-head h2{margin:0 0 2px;font-size:22px;color:var(--gold-hi)}
  .sd-head .lvl{color:var(--muted);font-size:13.5px}
  .retired{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.06em;
    text-transform:uppercase;color:var(--purple);border:1px solid rgba(164,143,212,.45);
    border-radius:4px;padding:2px 6px;margin-top:6px}
  @media(max-width:900px){
    .spell-layout{grid-template-columns:1fr}
    .spell-detail{position:static}
  }
</style>
</head>
<body>

<div class="page-head">
  <div class="wrap">
    <p class="crumb"><a href="index.html">Home</a> › Spells</p>
    <h1>Summoner Spells</h1>
    <p>All 16 spells in League Classic — including four that live League has since retired.
      Every one is available from summoner level 1.</p>
  </div>
</div>

<section>
  <div class="wrap">
    <div id="main"></div>
  </div>
</section>

<script src="site.js?v=95"></script>
<script>
renderChrome("Spells");

/* Gone from live League, kept here because the mode is built on the era
   when they were standard. */
const RETIRED = {
  Clairvoyance:"Removed from live League in 2014.",
  Fortify:"Removed from live League in 2011.",
  Promote:"Removed from Summoner's Rift in 2014.",
  Rally:"Removed from live League in 2011.",
  Revive:"Removed from Summoner's Rift in 2014.",
  Surge:"Removed from live League in 2014."
};

/* SPELLS is declared in site.js now and filled by loadSpells(), so this
   page reads the shared list rather than keeping a second copy. */
let picked = null;

boot("#main", async (el) => {
  await loadSpells();          /* fills the shared SPELLS */
  picked = SPELLS.find(s => normKey(s.name) === normKey(qs("s") || "")) || SPELLS[0];
  paint(el);
});

function paint(el){
  el.innerHTML = `<div class="spell-layout">
    <div>
      <div class="spell-grid" id="grid">
        ${SPELLS.map(s => `
          <button type="button" class="spell-tile ${picked && s.id === picked.id ? "on" : ""}"
                  data-spell="${esc(s.id)}" title="${esc(s.name)}">
            ${spellArt(s, {lazy:true})}
            <b>${esc(s.name)}</b>
            ${RETIRED[s.name] ? `<small>retired on live</small>` : ""}
          </button>`).join("")}
      </div>
      <p style="color:var(--muted-2);font-size:12.5px;margin-top:18px">
        ${SPELLS.length} spells · ${Object.keys(RETIRED).filter(n => SPELLS.some(s => s.name === n)).length}
        no longer on live League · art from Data Dragon ${DD.patch}</p>
    </div>
    <aside class="spell-detail" id="detail"></aside>
  </div>`;

  paintDetail();
  $("#grid").addEventListener("click", e => {
    const b = e.target.closest("[data-spell]"); if(!b) return;
    picked = SPELLS.find(s => s.id === b.dataset.spell);
    $$("#grid .spell-tile").forEach(t => t.classList.toggle("on", t.dataset.spell === picked.id));
    paintDetail();
    history.replaceState(null, "", `?s=${encodeURIComponent(picked.name)}`);
  });
}

function paintDetail(){
  const s = picked;
  if(!s){ $("#detail").innerHTML = ""; return; }
  const retired = RETIRED[s.name];
  $("#detail").innerHTML = `
    <div class="card">
      <div class="sd-head">
        ${spellArt(s)}
        <div>
          <h2>${esc(s.name)}</h2>
          <div class="lvl">Summoner Level 1</div>
          ${retired ? `<span class="retired">Retired on live</span>` : ""}
        </div>
      </div>
      <div class="dd">${ddText(s.description)}</div>
      ${retired ? `<p style="margin:12px 0 0;color:var(--muted-2);font-size:12.5px">${esc(retired)}</p>` : ""}
    </div>

    <div class="card">
      <h3>At a glance</h3>
      <ul class="stats-list">
        ${s.cooldown ? `<li><span>Cooldown</span><b>${s.cooldown}s</b></li>` : ""}
        ${s.range ? `<li><span>Range</span><b>${esc(s.range)}</b></li>` : ""}
        <li><span>Cost</span><b>No cost</b></li>
        <li><span>Available from</span><b>Level 1</b></li>
      </ul>
      ${!s.cooldown ? `<p style="margin:10px 0 0;color:var(--muted-2);font-size:12px">
        The ${DD.patch} archive doesn't record a cooldown for this one, so it's left out rather
        than guessed at.</p>` : ""}
    </div>

    <div class="card">
      <h3>Guides using it</h3>
      <p style="margin:0;color:var(--muted);font-size:13.5px">
        No published guides pick ${esc(s.name)} yet.
        <a href="create.html" style="color:var(--gold-hi)">Write one →</a></p>
    </div>`;
}
</script>
</body>
</html>
