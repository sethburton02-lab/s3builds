<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Champion stats, abilities and published build guides for League of Legends Classic.">
<title>Champion — S3 Builds</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="S3 Builds">
<meta property="og:title" content="Champion — S3 Builds">
<meta property="og:description" content="Champion stats, abilities and published build guides for League of Legends Classic.">
<meta property="og:image" content="https://s3builds.net/logo-512.png">
<meta name="twitter:card" content="summary">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="site.css?v=191">
</head>
<body>
<div id="main" class="wrap"></div>

<script src="site.js?v=191"></script>
<script src="guide-sanitise.js?v=191"></script>
<script src="config.js?v=191"></script>
<script src="guide-store.js?v=191"></script>
<script src="guide-load.js?v=191"></script>
<script>
renderChrome("Champions");

const ID = qs("c");
let C = null, level = 1, KIT = null, BIN = null;

boot("#main", async (el) => {
  if(!ID) throw new Error("No champion given in the address.");
  /* The guide store, before anything paints. Without this the cache stays
     empty, backendLive() answers false, and every page falls back to this
     browser's localStorage — a site that looks like it works and quietly
     isn't using the database at all. */
  await loadStore();
  const res = await DD.champion(ID);
  C = res.data[Object.keys(res.data)[0]];
  document.title = `${C.name}, ${C.title} — S3 Builds`;
  /* ABILITIES COME FROM THE MODE, NOT THE ARCHIVE. This page used to render
     C.spells straight from Data Dragon 3.13.24, which is right for 69 of the
     77 champions and wrong for the rest: where League Classic kept an OLDER
     kit than 2013, the archive holds the version that survived into modern
     League. Karma was the clearest case — the archive has the 2013 rework
     (Inner Flame / Focused Resolve / Inspire), the mode runs the one before
     it (Heavenly Wave / Spirit Bond / Soul Shield). Jax and Twisted Fate
     differ the same way. loadChampSpells already preferred the mode's files;
     this page simply never called it.

     The bin comes too, so the ability text can have its numbers filled in
     the way the guide tooltips do. Both are allowed to fail: the renderer
     falls back to the archive, and says so. */
  [KIT, BIN] = await Promise.all([
    loadChampSpells({id: C.id, key: C.key, name: C.name}).catch(() => null),
    CLASSIC.champBin(C.key).catch(() => null)
  ]);
  paint(el);
});

/* Season 3 used linear per-level growth: base + growth × (level − 1). */
const at = (base, per) => num((base || 0) + (per || 0) * (level - 1));

const STATS = [
  ["Health",         "hp",           "hpperlevel"],
  ["Health regen",   "hpregen",      "hpregenperlevel",   "per 5s"],
  ["Resource",       "mp",           "mpperlevel"],
  ["Resource regen", "mpregen",      "mpregenperlevel",   "per 5s"],
  ["Attack damage",  "attackdamage", "attackdamageperlevel"],
  ["Armor",          "armor",        "armorperlevel"],
  ["Magic resist",   "spellblock",   "spellblockperlevel"],
  ["Move speed",     "movespeed",    null],
  ["Attack range",   "attackrange",  null]
];

/* One ability row, from the unified shape loadChampSpells returns.
   Resolved effect text when the character record is here and the ability's
   formulas are a shape the evaluator understands, the one-line summary
   otherwise -- the same fallback the guide tooltips use, and for the same
   reason: the summary always exists, so a row is never empty.

   esc() goes on the summary and NOT on the resolved text, because tipText
   escapes its own output and doing it twice prints the tags. */
function abilityHtml(sp, letter){
  if(!sp) return "";
  const passive = letter === "P";
  let body = "";
  if(!passive && BIN && sp.dyn){
    const scope = CLASSIC.spellScope(BIN, letter);
    if(scope) body = CLASSIC.tipText(sp.dyn, scope, sp.ranks || 5);
  }
  const nums = passive ? "" : `<div class="nums">
    <span>Cooldown <b>${esc(sp.cooldown || "–")}${sp.cooldown ? "s" : ""}</b></span>
    <span>Cost <b>${esc(sp.cost || "–")}</b></span>
    <span>Range <b>${esc(sp.range || "–")}</b></span>
    <span>Max rank <b>${esc(String(sp.ranks || 5))}</b></span>
  </div>`;
  return `<div class="ability">
    <div class="ico">${sp.icon ? `<img src="${esc(sp.icon)}" alt="">` : ""}
      <span class="key">${esc(letter)}</span></div>
    <div style="min-width:0">
      <h4>${esc(sp.name)}</h4>
      <div class="dd">${body || esc(sp.desc || "")}</div>
      ${nums}
    </div>
  </div>`;
}

function paint(el){
  const s = C.stats, info = C.info || {};
  /* The mode's kit when it loaded, the archive's shape mapped onto the same
     fields when it didn't, so the markup below has one shape to render. */
  const kitPassive = (KIT && KIT.passive) || (C.passive ? {
    letter: "P", name: C.passive.name,
    icon: C.passive.image ? DD.passImg(C.passive.image.full) : null,
    desc: ddText(C.passive.description || "").replace(/<[^>]+>/g, " ").trim()
  } : null);
  const kitSpells = (KIT && KIT.spells) || (C.spells || []).slice(0, 4)
    .map((sp, i) => ({
      letter: "QWER"[i], name: sp.name,
      icon: sp.image ? DD.spellImg(sp.image.full) : null,
      desc: ddText(sp.description || "").replace(/<[^>]+>/g, " ").trim(),
      cooldown: sp.cooldownBurn || null, cost: sp.costBurn || null,
      range: sp.rangeBurn || null, ranks: sp.maxrank || 5
    }));

  el.innerHTML = `
  <p class="crumb" style="padding-top:20px">
    <a href="index.html">Home</a> › <a href="champions.html">Champions</a> › ${esc(C.name)}</p>

  <div class="detail">
    <aside class="side">
      <div class="hero-art">${art({
        s3: DD.champImg(C.id),
        classic: CLASSIC.champIcon(C.key, C.name),
        alt: C.name })}</div>

      <div class="card">
        <h3>Base stats <span style="text-transform:none;letter-spacing:0;color:var(--muted-2)">
          — level <b id="lvlOut" style="color:var(--gold-hi)">1</b></span></h3>
        <div class="lvl-row">
          <input type="range" id="lvl" min="1" max="18" value="1" aria-label="Champion level">
          <b id="lvlLabel">Level 1</b>
        </div>
        <ul class="stats-list" id="statList"></ul>
        <p class="stat-src" id="statSrc"></p>
      </div>

      <div class="card">
        <h3>Difficulty</h3>
        <ul class="stats-list">
          ${["attack","magic","defense","difficulty"].map(k => `
            <li><span>${k[0].toUpperCase()+k.slice(1)}</span><b>${info[k] ?? "–"} / 10</b></li>`).join("")}
        </ul>
      </div>

      ${C.skins && C.skins.length > 1 ? `<div class="card">
        <h3>Skins in the ${DD.patch} archive</h3>
        <ul class="stats-list">${C.skins.filter(k => k.num !== 0)
          .map(k => `<li><span>${esc(k.name)}</span><b>#${k.num}</b></li>`).join("")}</ul>
      </div>` : ""}
    </aside>

    <main>
      <!-- No portrait here. The same square icon already runs full-width at
           the top of the sidebar, level with this heading, so a 60px copy
           beside the name was the same picture twice. -->
      <div class="title-row">
        <div>
          <h1>${esc(C.name)}</h1>
          <div class="sub">${esc(C.title)}</div>
        </div>
      </div>
      <div class="tagrow">
        ${(C.tags || []).map(t => `<span class="chip gold">${esc(t)}</span>`).join("")}
        <span class="chip">${esc(C.partype || "No resource")}</span>
        <span class="chip" data-patch>${patchLabel()}</span>
      </div>

      <div class="card" style="margin-top:18px">
        <h3>Abilities</h3>

        ${abilityHtml(kitPassive, "P")}
        ${kitSpells.map(sp => abilityHtml(sp, sp.letter)).join("")}
        ${KIT && KIT.source !== "classic" ? `<p class="dd" style="margin:10px 0 0;
          color:var(--muted-2);font-size:12.5px">The mode's own ability files
          couldn't be reached, so these are the Season 3 archive's. A few
          champions run an older kit in Classic than the archive records.</p>` : ""}
      </div>

      ${(C.allytips || []).length ? tipCard("Playing as " + C.name, C.allytips) : ""}
      ${(C.enemytips || []).length ? tipCard("Playing against " + C.name, C.enemytips) : ""}

      <div class="card" style="margin-top:14px">
        <h3>Guides</h3>
        ${guidesCardHtml(C.name)}
      </div>
    </main>
  </div>`;

  const slider = $("#lvl");
  slider.addEventListener("input", e => { level = +e.target.value; paintStats(); });
  paintStats();
  paintPatch();
  loadClassicStats();
}

/* This used to say "no published guides yet" unconditionally — it never
   asked. Now it lists what has actually been published for this champion. */
function guidesCardHtml(name){
  const rows = guidesFor(name);
  if(!rows.length)
    return `<p style="margin:0;color:var(--muted);font-size:13.5px">
      No published ${esc(name)} guides yet.
      <a href="create.html" style="color:var(--gold-hi)">Write the first one →</a></p>`;
  return `<ul class="stats-list champ-guides">${rows.map(g =>
    `<li><a href="guide.html?g=${encodeURIComponent(g.slug)}">
       <b>${esc(g.title)}</b>
       <span>${esc(g.role || "")}${g.author ? " · " + esc(g.author) : ""}</span>
     </a></li>`).join("")}</ul>
    <p style="margin:10px 0 0;font-size:13px">
      <a href="create.html" style="color:var(--gold-hi)">Write another →</a></p>`;
}

function tipCard(title, tips){
  return `<div class="card" style="margin-top:14px">
    <h3>${esc(title)}</h3>
    <div class="dd"><ul>${tips.map(t => `<li>${esc(t)}</li>`).join("")}</ul></div>
  </div>`;
}

/* The mode's own numbers when they arrived, the archive's when they didn't.
   Held separately rather than merged into C.stats so the source stays
   knowable — the page says which one it is showing, and a half-merged
   object would make that a guess. */
let CSTATS = null, statsResolved = false;

/* Resource rows are dropped for a champion who has none. Left in, Garen got
   a "Resource 0" line, which reads as missing data rather than as rage. */
function statRows(){
  const none = CSTATS && CSTATS.resource === "none";
  return STATS.filter(([, base]) => !(none && /^mp/.test(base)));
}

/* One stat, and where it came from. A field the mode's record omits falls
   back to the archive's rather than dropping its row: Gangplank is the only
   champion of the 72 whose record has no base health regen, and his growth
   figure is present and matches the archive's exactly, so the base looks
   dropped in the export rather than deliberately zero. Showing nothing
   there loses a real number; showing the archive's and saying so doesn't.
   Returns undefined when neither source has it, which is the honest gap. */
function statValue(base){
  if(CSTATS && CSTATS[base] !== undefined && CSTATS[base] !== null)
    return {v: CSTATS[base], fellBack: false};
  const dd = C.stats[base];
  if(dd === undefined || dd === null) return null;
  /* Flagged only when the mode's numbers are the ones otherwise on show —
     with no CSTATS at all the whole list is the archive and the source line
     already says so. */
  return {v: dd, fellBack: !!CSTATS};
}

function paintStats(){
  $("#lvlLabel").textContent = "Level " + level;
  $("#lvlOut").textContent = level;

  const mixed = [];
  $("#statList").innerHTML = statRows().map(([label, base, per, unit]) => {
    const got = statValue(base);
    if(!got) return "";                 /* neither source has it */
    /* Both resource rows, not just the first: labelling the bar "Energy" and
       the line under it "Resource regen" reads like two different stats. */
    const lbl = CSTATS && CSTATS.resource === "energy"
      ? label.replace(/^Resource/, "Energy") : label;
    if(got.fellBack) mixed.push(lbl.toLowerCase());
    /* The growth figure follows its own base: a mode base paired with an
       archive growth, or the reverse, is a number from nowhere. */
    const g = per ? statValue(per) : null;
    const val = g ? at(got.v, g.v) : num(got.v);
    const growth = g && g.v ? `<em>+${num(g.v)}/lvl</em>` : "";
    return `<li><span>${lbl}${unit ? ` <em>${unit}</em>` : ""}</span><b>${val}${growth}</b></li>`;
  }).join("");

  /* Silent until the fetch has settled. Saying "from the archive" during the
     second it takes to answer would flash a correction on every load, and
     the one wrong-looking thing on the page would be the bit claiming to
     say where the numbers came from. */
  const src = $("#statSrc");
  if(src) src.textContent = !statsResolved ? ""
    : !CSTATS
      ? "From the Season 3 archive — the mode's own figures couldn't be reached, and it tunes most champions a little higher."
    : mixed.length
      ? `From the mode's own game files, except ${listWords(mixed)}, which the mode's file omits — those are the Season 3 archive's.`
      : "From the mode's own game files.";
}

/* "a, b and c" — the source line names the fallen-back rows, so it has to
   read as a sentence rather than a comma-joined array. */
function listWords(xs){
  const u = [...new Set(xs)];
  return u.length < 2 ? (u[0] || "")
    : u.slice(0, -1).join(", ") + " and " + u[u.length - 1];
}

/* Fetched after the page has painted, not before: the stat file is a
   separate request and blocking the whole champion on it would trade a
   working page for a slightly more accurate one. */
async function loadClassicStats(){
  CSTATS = await CLASSIC.champStats(C.key).catch(() => null);
  statsResolved = true;
  paintStats();                 /* repaints the rows and the source line */
}
</script>
</body>
</html>
